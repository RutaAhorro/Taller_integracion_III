# Complemento local: no modifica PostgreSQL ni publica OTP fuera de localhost.
# Uso junto con docker-compose.yml; requiere streetGraph.obj ya construido.
services:
  otp_vial:
    image: opentripplanner/opentripplanner:2.8.1
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:ActiveProcessorCount=2"
    volumes:
      - type: bind
        source: ./datos-locales/mapas/streetGraph.obj
        target: /var/opentripplanner/graph.obj
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8092:8080"
    networks:
      microservices_net:
        aliases: [otp-vial]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  motor_rutas:
    environment:
      RUTAS_OTP_URL: http://otp-vial:8080
      RUTAS_MAX_PARADAS: "2"
