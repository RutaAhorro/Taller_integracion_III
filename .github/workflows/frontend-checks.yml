name: Frontend checks

on:
  pull_request:
    branches: [main, develop, develop-refactor]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [develop-refactor]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/web/package-lock.json'
      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Typecheck
        working-directory: frontend/web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend/web
        run: npm run lint
      - name: Tests
        working-directory: frontend/web
        run: npm test
      - name: Build
        working-directory: frontend/web
        run: npm run build
