name: Gateway checks

on:
  pull_request:
    branches: [main, develop, develop-refactor]
    paths:
      - 'backend/gateway/**'
      - 'backend/catalogo/**'
      - 'backend/api/**'
      - 'frontend/web/**'
      - 'docker-compose*.yml'
      - 'infrastructure/k8s/**'
      - 'scripts/smoke_gateway_compose.sh'
      - 'scripts/smoke_catalogo_routing_compose.sh'
      - '.github/workflows/**'
  push:
    branches: [develop-refactor]
    paths:
      - 'backend/gateway/**'
      - 'backend/catalogo/**'
      - 'backend/api/**'
      - 'frontend/web/**'
      - 'docker-compose*.yml'
      - 'infrastructure/k8s/**'
      - 'scripts/smoke_gateway_compose.sh'
      - 'scripts/smoke_catalogo_routing_compose.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: API tests, module boundaries and build
        working-directory: backend/api
        run: |
          go test -race ./...
          go vet ./...
          go build -o /tmp/sup268-api .

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Gateway tests and build
        working-directory: backend/gateway
        run: |
          go test -race ./...
          go vet ./...
          go build ./cmd/gateway
      - name: Build runtime image
        run: docker build -t sup265-gateway:local backend/gateway

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compose smoke and rollback
        run: bash scripts/smoke_catalogo_routing_compose.sh

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install schema validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - name: Validate Gateway Kubernetes manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.32.0 \
            infrastructure/k8s/gateway/ \
            infrastructure/k8s/catalogo/ \
            infrastructure/k8s/api/
