name: Catalogo checks

on:
  pull_request:
    branches: [main, develop, develop-refactor]
    paths:
      - 'backend/catalogo/**'
      - 'backend/api/**'
      - 'infrastructure/db/**'
      - 'docker-compose.catalogo-test.yml'
      - 'scripts/smoke_catalogo_compose.sh'
      - '.github/workflows/**'
  push:
    branches: [develop-refactor]
    paths:
      - 'backend/catalogo/**'
      - 'backend/api/**'
      - 'infrastructure/db/**'
      - 'docker-compose.catalogo-test.yml'
      - 'scripts/smoke_catalogo_compose.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Catalog tests, architecture, vet and build
        working-directory: backend/catalogo
        run: |
          go test -race ./...
          go vet ./...
          go build -o /tmp/catalogo ./cmd/catalogo

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare catalog and API on isolated fixtures
        run: bash scripts/smoke_catalogo_compose.sh
