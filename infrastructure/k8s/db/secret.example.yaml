# =============================================================================
# Plantilla de ejemplo para el Secret de base de datos y JWT (db-secret)
# =============================================================================
# IMPORTANTE:
# - Todos los valores de este archivo son FALSOS y solo sirven como referencia
#   de la estructura y las claves esperadas por los Deployments.
# - NUNCA subas un archivo secret.yaml con credenciales reales al repositorio
#   (está bloqueado por .gitignore).
# - El Secret real debe existir en el namespace ANTES de aplicar
#   infrastructure/k8s/db/deployment.yaml y los servicios que consumen JWT_SECRET.
#
# Cómo crear el Secret real directamente en el clúster (sin guardarlo en git):
#
#   kubectl create secret generic db-secret -n student-vmatus \
#     --from-literal=POSTGRES_USER="<usuario-admin-postgres>" \
#     --from-literal=POSTGRES_PASSWORD="<password-admin-postgres>" \
#     --from-literal=POSTGRES_DB="supermercados" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# También puedes exportar las variables en tu terminal y pasarlas como
# --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" (sin imprimirlas).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app: db
type: Opaque
stringData:
  POSTGRES_USER: CAMBIAR_USUARIO_POSTGRES
  POSTGRES_PASSWORD: CAMBIAR_ESTE_VALOR
  POSTGRES_DB: CAMBIAR_NOMBRE_BD
  JWT_SECRET: CAMBIAR_ESTE_SECRETO_JWT
