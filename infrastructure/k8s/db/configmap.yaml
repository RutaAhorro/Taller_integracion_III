#   python3 scripts/sync_db_init_configmap.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-scripts
  labels:
    app: db
data:
  01_schema_api.sql: |
    -- =======================================================
    -- ESQUEMA api: DOMINIO 1 (Identidad/Usuarios) y DOMINIO 4 (Catálogo Maestro/IA)
    -- =======================================================

    CREATE SCHEMA IF NOT EXISTS api;

    -- 1. Tabla Usuarios (Dominio 1)
    CREATE TABLE IF NOT EXISTS api.usuarios (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        google_id VARCHAR(255) UNIQUE,
        correo VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255),
        nombre_completo VARCHAR(255) NOT NULL,
        telefono VARCHAR(50),
        direccion VARCHAR(255),
        url_avatar VARCHAR(500),
        rol VARCHAR(30) NOT NULL DEFAULT 'registrado',
        cuota_tokens_ia INTEGER NOT NULL DEFAULT 1000,
        esta_activo BOOLEAN NOT NULL DEFAULT true,
        token_verificacion UUID,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW(),
        actualizado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 2. Categorías (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.categorias (
        id SERIAL PRIMARY KEY,
        padre_id INTEGER REFERENCES api.categorias(id) ON DELETE SET NULL,
        nombre VARCHAR(100) NOT NULL,
        slug VARCHAR(100) UNIQUE NOT NULL
    );

    -- 3. Marcas (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.marcas (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) UNIQUE NOT NULL
    );

    -- 4. Productos Normalizados (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.productos_normalizados (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        categoria_id INTEGER REFERENCES api.categorias(id) ON DELETE SET NULL,
        marca_id INTEGER REFERENCES api.marcas(id) ON DELETE SET NULL,
        codigo_barras_ean VARCHAR(50) UNIQUE,
        nombre_estandar VARCHAR(255) NOT NULL,
        contenido_neto DECIMAL(8,2),
        unidad_medida VARCHAR(20),
        es_sin_gluten BOOLEAN DEFAULT false,
        es_vegano BOOLEAN DEFAULT false,
        es_sin_lactosa BOOLEAN DEFAULT false,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 5. Preferencias Dietéticas de Usuario (Dominio 1)
    CREATE TABLE IF NOT EXISTS api.preferencias_dieteticas_usuario (
        id SERIAL PRIMARY KEY,
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        etiqueta_dietetica VARCHAR(50) NOT NULL,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW(),
        CONSTRAINT uq_usuario_etiqueta UNIQUE (usuario_id, etiqueta_dietetica)
    );

    -- 6. Direcciones de Usuario (Dominio 1)
    CREATE TABLE IF NOT EXISTS api.direcciones_usuario (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        etiqueta VARCHAR(100),
        texto_direccion VARCHAR(255) NOT NULL,
        lat DECIMAL(10,8) NOT NULL,
        lon DECIMAL(11,8) NOT NULL,
        es_principal BOOLEAN DEFAULT false
    );

    -- 7. Perfiles de Transporte de Usuario (Dominio 1)
    CREATE TABLE IF NOT EXISTS api.perfiles_transporte_usuario (
        id SERIAL PRIMARY KEY,
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        modo_transporte VARCHAR(50) NOT NULL,
        tipo_combustible VARCHAR(50),
        rendimiento_combustible_km_l DECIMAL(5,2),
        tarifa_transporte_publico DECIMAL(10,2),
        radio_maximo_km DECIMAL(5,2) DEFAULT 10.0,
        es_principal BOOLEAN DEFAULT true
    );

    -- 8. Tarjetas de Fidelidad de Usuario (Dominio 1)
    CREATE TABLE IF NOT EXISTS api.tarjetas_fidelidad_usuario (
        id SERIAL PRIMARY KEY,
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        cadena_id INTEGER NOT NULL, -- Referencia diferida a scraper.cadenas_supermercado
        tipo_tarjeta VARCHAR(100) NOT NULL,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 9. Misiones de Validación de Colaborador (Dominio 1 - Colaboradores)
    CREATE TABLE IF NOT EXISTS api.misiones_validacion (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        sucursal_id INTEGER NOT NULL,
        producto_id UUID REFERENCES api.productos_normalizados(id) ON DELETE SET NULL,
        precio_reportado DECIMAL(12,2),
        stock_disponible BOOLEAN DEFAULT true,
        gasto_transporte_reportado DECIMAL(12,2),
        url_evidencia_foto VARCHAR(500),
        tokens_otorgados INTEGER DEFAULT 500,
        estado VARCHAR(30) DEFAULT 'aprobado',
        completada_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 10. Equivalencias de Productos (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.equivalencias_productos (
        id BIGSERIAL PRIMARY KEY,
        producto_master_id UUID NOT NULL REFERENCES api.productos_normalizados(id) ON DELETE CASCADE,
        producto_alias_id UUID NOT NULL REFERENCES api.productos_normalizados(id) ON DELETE CASCADE,
        definido_por_admin_id UUID REFERENCES api.usuarios(id) ON DELETE SET NULL,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW(),
        CONSTRAINT uq_producto_equivalencia UNIQUE (producto_master_id, producto_alias_id)
    );

    -- 11. Recetas (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.recetas (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        creado_por_usuario UUID REFERENCES api.usuarios(id) ON DELETE SET NULL,
        titulo VARCHAR(200) NOT NULL,
        descripcion TEXT,
        porciones INTEGER DEFAULT 4,
        instrucciones TEXT,
        es_comunidad BOOLEAN DEFAULT false,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 12. Ingredientes de Receta (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.ingredientes_receta (
        id SERIAL PRIMARY KEY,
        receta_id UUID NOT NULL REFERENCES api.recetas(id) ON DELETE CASCADE,
        producto_normalizado_id UUID REFERENCES api.productos_normalizados(id) ON DELETE SET NULL,
        texto_ingrediente_crudo VARCHAR(255) NOT NULL,
        cantidad_requerida DECIMAL(8,2),
        unidad VARCHAR(30)
    );

    -- 13. Mapeos de Productos por IA (Dominio 4)
    CREATE TABLE IF NOT EXISTS api.mapeos_productos_ia (
        id BIGSERIAL PRIMARY KEY,
        producto_crudo_id UUID UNIQUE NOT NULL, -- Referencia diferida a scraper.productos_crudos
        producto_normalizado_id UUID NOT NULL REFERENCES api.productos_normalizados(id) ON DELETE CASCADE,
        nivel_confianza DECIMAL(4,3),
        version_modelo VARCHAR(50),
        estado VARCHAR(30) DEFAULT 'mapeado',
        procesado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- Restricciones de Integridad Referencial Cruzadas (Cross-Schema Foreign Keys)
    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='scraper' AND table_name='cadenas_supermercado') THEN
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_tarjetas_cadena') THEN
                ALTER TABLE api.tarjetas_fidelidad_usuario
                    ADD CONSTRAINT fk_tarjetas_cadena
                    FOREIGN KEY (cadena_id) REFERENCES scraper.cadenas_supermercado(id) ON DELETE CASCADE;
            END IF;
        END IF;

        IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='scraper' AND table_name='sucursales_supermercado') THEN
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_misiones_sucursal') THEN
                ALTER TABLE api.misiones_validacion
                    ADD CONSTRAINT fk_misiones_sucursal
                    FOREIGN KEY (sucursal_id) REFERENCES scraper.sucursales_supermercado(id) ON DELETE CASCADE;
            END IF;
        END IF;
    END $$;
  02_schema_scraper.sql: |
    -- =======================================================
    -- ESQUEMA scraper: DOMINIO 2 (Cadenas y Sucursales) y DOMINIO 3 (Extracción Raw y Precios)
    -- =======================================================

    CREATE SCHEMA IF NOT EXISTS scraper;

    -- 1. Cadenas de Supermercado (Dominio 2)
    CREATE TABLE IF NOT EXISTS scraper.cadenas_supermercado (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) UNIQUE NOT NULL,
        url_sitio_web VARCHAR(255),
        url_logo VARCHAR(255),
        config_scraper_json JSONB,
        esta_activa BOOLEAN DEFAULT true,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 2. Sucursales de Supermercado (Dominio 2)
    CREATE TABLE IF NOT EXISTS scraper.sucursales_supermercado (
        id SERIAL PRIMARY KEY,
        cadena_id INTEGER NOT NULL REFERENCES scraper.cadenas_supermercado(id) ON DELETE CASCADE,
        codigo_sucursal VARCHAR(50),
        nombre VARCHAR(150) NOT NULL,
        direccion VARCHAR(255) NOT NULL,
        comuna VARCHAR(100),
        ciudad VARCHAR(100),
        lat DECIMAL(10,8) NOT NULL,
        lon DECIMAL(11,8) NOT NULL,
        hora_apertura TIME,
        hora_cierre TIME,
        esta_activa BOOLEAN DEFAULT true
    );

    -- Index geoespacial para consultas de ubicación de sucursales
    CREATE INDEX IF NOT EXISTS idx_sucursales_coords ON scraper.sucursales_supermercado (lat, lon);

    -- 3. Trabajos de Scraper (Dominio 3)
    CREATE TABLE IF NOT EXISTS scraper.trabajos_scraper (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        cadena_id INTEGER NOT NULL REFERENCES scraper.cadenas_supermercado(id) ON DELETE CASCADE,
        disparado_por_usuario_id UUID REFERENCES api.usuarios(id) ON DELETE SET NULL,
        estado VARCHAR(30) NOT NULL DEFAULT 'pendiente',
        iniciado_el TIMESTAMP NOT NULL DEFAULT NOW(),
        finalizado_el TIMESTAMP,
        elementos_extraidos INTEGER DEFAULT 0,
        respuestas_bloqueadas INTEGER DEFAULT 0,
        registro_errores TEXT
    );

    -- 4. Productos Crudos (Dominio 3)
    CREATE TABLE IF NOT EXISTS scraper.productos_crudos (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        sucursal_id INTEGER NOT NULL REFERENCES scraper.sucursales_supermercado(id) ON DELETE CASCADE,
        sku VARCHAR(100) NOT NULL,
        ean_gtin VARCHAR(50),
        titulo_crudo VARCHAR(255) NOT NULL,
        marca_cruda VARCHAR(100),
        categoria_cruda VARCHAR(100),
        formato_crudo VARCHAR(100),
        url_producto TEXT,
        url_imagen TEXT,
        en_stock BOOLEAN DEFAULT true,
        ultima_extraccion_el TIMESTAMP NOT NULL DEFAULT NOW(),
        CONSTRAINT uq_sucursal_sku UNIQUE (sucursal_id, sku)
    );

    CREATE INDEX IF NOT EXISTS idx_productos_crudos_ean ON scraper.productos_crudos (ean_gtin);

    -- 5. Capturas de Precios (Dominio 3 - Serie de tiempo)
    CREATE TABLE IF NOT EXISTS scraper.capturas_precios (
        id BIGSERIAL PRIMARY KEY,
        producto_crudo_id UUID NOT NULL REFERENCES scraper.productos_crudos(id) ON DELETE CASCADE,
        precio_normal DECIMAL(12,2) NOT NULL,
        precio_oferta DECIMAL(12,2),
        precio_tarjeta DECIMAL(12,2),
        precio_por_unidad DECIMAL(12,2),
        metrica_unidad VARCHAR(20),
        mecanica_promocion VARCHAR(255),
        esta_disponible BOOLEAN DEFAULT true,
        capturado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- Índice para acelerar búsquedas en la serie de tiempo de precios
    CREATE INDEX IF NOT EXISTS idx_capturas_prod_fecha ON scraper.capturas_precios (producto_crudo_id, capturado_el DESC);
  03_indices_optimizacion.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    CREATE INDEX IF NOT EXISTS idx_productos_titulo_trgm ON scraper.productos_crudos USING gin (titulo_crudo gin_trgm_ops);
    CREATE INDEX IF NOT EXISTS idx_productos_marca_trgm ON scraper.productos_crudos USING gin (marca_cruda gin_trgm_ops);
    CREATE INDEX IF NOT EXISTS idx_productos_categoria_trgm ON scraper.productos_crudos USING gin (categoria_cruda gin_trgm_ops);
  03_schema_rutas.sql: |
    -- =======================================================
    -- ESQUEMA rutas: DOMINIO 5 (Listas de Compras, Optimización Espacial y Rutas TSP)
    -- =======================================================

    CREATE SCHEMA IF NOT EXISTS rutas;

    -- 1. Listas de Compras (Dominio 5)
    CREATE TABLE IF NOT EXISTS rutas.listas_compras (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        nombre VARCHAR(150) NOT NULL,
        estado VARCHAR(30) DEFAULT 'activa',
        creada_el TIMESTAMP NOT NULL DEFAULT NOW(),
        actualizada_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 2. Artículos de Lista de Compras (Dominio 5)
    CREATE TABLE IF NOT EXISTS rutas.articulos_lista_compras (
        id SERIAL PRIMARY KEY,
        lista_id UUID NOT NULL REFERENCES rutas.listas_compras(id) ON DELETE CASCADE,
        producto_normalizado_id UUID NOT NULL REFERENCES api.productos_normalizados(id) ON DELETE CASCADE,
        cantidad INTEGER NOT NULL DEFAULT 1,
        esta_comprado BOOLEAN DEFAULT false
    );

    -- 3. Ejecuciones de Optimización (Dominio 5)
    CREATE TABLE IF NOT EXISTS rutas.ejecuciones_optimizacion (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        lista_id UUID NOT NULL REFERENCES rutas.listas_compras(id) ON DELETE CASCADE,
        transporte_usuario_id INTEGER REFERENCES api.perfiles_transporte_usuario(id) ON DELETE SET NULL,
        lat_inicio DECIMAL(10,8) NOT NULL,
        lon_inicio DECIMAL(11,8) NOT NULL,
        costo_total_productos DECIMAL(12,2) NOT NULL,
        costo_estimado_viaje DECIMAL(12,2) NOT NULL,
        ahorro_neto_estimado DECIMAL(12,2) NOT NULL,
        distancia_total_metros INTEGER,
        duracion_total_segundos INTEGER,
        calculado_el TIMESTAMP NOT NULL DEFAULT NOW()
    );

    -- 4. Paradas de Optimización (Dominio 5)
    CREATE TABLE IF NOT EXISTS rutas.paradas_optimizacion (
        id SERIAL PRIMARY KEY,
        optimizacion_id UUID NOT NULL REFERENCES rutas.ejecuciones_optimizacion(id) ON DELETE CASCADE,
        sucursal_id INTEGER NOT NULL REFERENCES scraper.sucursales_supermercado(id) ON DELETE CASCADE,
        orden_visita INTEGER NOT NULL,
        costo_subtotal DECIMAL(12,2) NOT NULL
    );

    -- 5. Detalle de Artículos por Parada (Dominio 5)
    CREATE TABLE IF NOT EXISTS rutas.detalle_articulos_parada (
        id SERIAL PRIMARY KEY,
        parada_id INTEGER NOT NULL REFERENCES rutas.paradas_optimizacion(id) ON DELETE CASCADE,
        producto_crudo_id UUID NOT NULL REFERENCES scraper.productos_crudos(id) ON DELETE CASCADE,
        captura_precio_id BIGINT NOT NULL REFERENCES scraper.capturas_precios(id) ON DELETE CASCADE,
        cantidad INTEGER NOT NULL DEFAULT 1,
        precio_unitario_aplicado DECIMAL(12,2) NOT NULL
    );
  04_migracion_nuevas_cadenas.sql: |
    -- =======================================================
    -- MIGRACIÓN: Agregar cadenas A Cuenta y Cugat
    -- Fecha: 2024-10-04
    -- Descripción: Agrega las cadenas de supermercado A Cuenta y Cugat
    --              con sus sucursales por defecto para la ingesta de scraping.
    --              Seguro para ejecutar múltiples veces (idempotente).
    -- Uso: psql -U <usuario> -d <base_datos> -f 04_migracion_nuevas_cadenas.sql
    -- =======================================================

    BEGIN;

    -- 1. Insertar cadenas nuevas (no toca las existentes)
    INSERT INTO scraper.cadenas_supermercado (id, nombre, url_sitio_web, url_logo, esta_activa, creado_el)
    VALUES
        (5, 'A Cuenta', 'https://www.acuenta.cl', '/logos/acuenta.png', true, NOW()),
        (6, 'Cugat',    'https://cugat.cl',       '/logos/cugat.png',   true, NOW())
    ON CONFLICT (id) DO UPDATE SET
        url_sitio_web = EXCLUDED.url_sitio_web,
        url_logo      = EXCLUDED.url_logo,
        esta_activa   = EXCLUDED.esta_activa;

    -- 2. Actualizar la secuencia para evitar colisiones en auto-creates del Go
    SELECT setval(
        'scraper.cadenas_supermercado_id_seq',
        (SELECT MAX(id) FROM scraper.cadenas_supermercado)
    );

    -- 3. Insertar sucursales por defecto para las cadenas nuevas
    --    (punto de referencia online en Temuco para la ingesta del scraper)
    INSERT INTO scraper.sucursales_supermercado
        (id, cadena_id, codigo_sucursal, nombre, direccion, comuna, ciudad, lat, lon, esta_activa)
    VALUES
        (5, 5, 'ACUENTA-CENTRAL', 'A Cuenta Online', 'Casa Matriz / Online', 'Temuco', 'Temuco', -38.73590000, -72.59040000, true),
        (6, 6, 'CUGAT-CENTRAL',   'Cugat Online',    'Casa Matriz / Online', 'Temuco', 'Temuco', -38.73590000, -72.59040000, true)
    ON CONFLICT (id) DO NOTHING;

    -- 4. Actualizar la secuencia de sucursales
    SELECT setval(
        'scraper.sucursales_supermercado_id_seq',
        (SELECT MAX(id) FROM scraper.sucursales_supermercado)
    );

    -- 5. Verificación: mostrar las cadenas y sucursales registradas
    DO $$
    BEGIN
        RAISE NOTICE '=== Cadenas de supermercado registradas ===';
    END $$;

    SELECT id, nombre, url_sitio_web, esta_activa
    FROM scraper.cadenas_supermercado
    ORDER BY id;

    SELECT s.id, c.nombre AS cadena, s.codigo_sucursal, s.nombre AS sucursal, s.esta_activa
    FROM scraper.sucursales_supermercado s
    JOIN scraper.cadenas_supermercado c ON c.id = s.cadena_id
    ORDER BY s.id;

    COMMIT;
  05_recuperacion_scraping.sql: |
    -- SUP-270. Aplicar antes de desplegar API/Catálogo/worker nuevos.
    -- Tablas aditivas; no alteran ni eliminan los datos existentes.
    BEGIN;
    -- Propiedad exclusiva de Catálogo. Sin referencias a trabajos ni usuarios.
    CREATE TABLE IF NOT EXISTS scraper.lotes_catalogo (
        id UUID PRIMARY KEY,
        payload_hash CHAR(64) NOT NULL,
        resultado JSONB NOT NULL,
        confirmado_el TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Propiedad de coordinación. La entrega y su contador se confirman juntos.
    CREATE TABLE IF NOT EXISTS scraper.entregas_ingesta (
        id UUID PRIMARY KEY,
        trabajo_id UUID REFERENCES scraper.trabajos_scraper(id),
        cadena_id INTEGER NOT NULL DEFAULT 0,
        sucursal_id INTEGER,
        payload_hash CHAR(64) NOT NULL,
        payload JSONB NOT NULL,
        estado TEXT NOT NULL DEFAULT 'pendiente' CHECK (estado IN ('pendiente','confirmada','fallida')),
        intentos INTEGER NOT NULL DEFAULT 0,
        proximo_intento TIMESTAMPTZ NOT NULL DEFAULT now(),
        lease_token UUID,
        lease_hasta TIMESTAMPTZ,
        ultimo_error TEXT,
        resultado JSONB,
        creado_el TIMESTAMPTZ NOT NULL DEFAULT now(),
        confirmado_el TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_entregas_ingesta_pendientes
        ON scraper.entregas_ingesta(proximo_intento) WHERE estado = 'pendiente';
    CREATE INDEX IF NOT EXISTS idx_entregas_ingesta_trabajo ON scraper.entregas_ingesta(trabajo_id);

    -- Outbox de ejecuciones: permite reconstruir Redis sin perder trabajos.
    CREATE TABLE IF NOT EXISTS scraper.entregas_trabajos (
        trabajo_id UUID PRIMARY KEY REFERENCES scraper.trabajos_scraper(id),
        payload_hash CHAR(64) NOT NULL,
        payload JSONB NOT NULL,
        proxima_publicacion TIMESTAMPTZ NOT NULL DEFAULT now(),
        creado_el TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_entregas_trabajos_publicacion
        ON scraper.entregas_trabajos(proxima_publicacion);
    COMMIT;
  05_tokens_recuperacion.sql: |
    -- SUP-184. Ejecutar como operador ANTES de re-ejecutar 06_propiedad_permisos.sql,
    -- que concede los permisos de esta tabla a app_identity. Idempotente.
    -- Tokens de un solo uso para restablecer contraseña: se guarda sólo el SHA-256;
    -- el token en claro viaja únicamente en el correo.
    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    CREATE TABLE IF NOT EXISTS api.tokens_recuperacion (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        usuario_id UUID NOT NULL REFERENCES api.usuarios(id) ON DELETE CASCADE,
        token_hash BYTEA NOT NULL UNIQUE CHECK (octet_length(token_hash) = 32),
        expira_el TIMESTAMPTZ NOT NULL,
        usado_el TIMESTAMPTZ,
        creado_el TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_tokens_recuperacion_usuario
        ON api.tokens_recuperacion (usuario_id, creado_el DESC);

    COMMENT ON TABLE api.tokens_recuperacion IS 'SUP-184: tokens de restablecimiento de contraseña; dueño Identidad (app_identity)';
    COMMENT ON COLUMN api.tokens_recuperacion.token_hash IS 'SHA-256 del token enviado por correo; el token en claro nunca se guarda';
    COMMENT ON COLUMN api.tokens_recuperacion.usado_el IS 'Consumido (SUP-185) o reemplazado por una solicitud más nueva; con valor, el token ya no sirve';
    COMMIT;
  06_propiedad_permisos.sql: |
    -- SUP-271. Ejecutar como operador de migraciones, nunca desde un servicio.
    -- No mueve tablas ni borra filas. Los roles quedan sin LOGIN hasta provisionar
    -- sus contraseñas por separado (07_runtime_credentials.sh o \password en psql).
    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    ALTER TABLE scraper.trabajos_scraper
        ADD COLUMN IF NOT EXISTS cadena_nombre VARCHAR(100) NOT NULL DEFAULT '';
    UPDATE scraper.trabajos_scraper AS t SET cadena_nombre = c.nombre
        FROM scraper.cadenas_supermercado AS c
        WHERE t.cadena_id = c.id AND t.cadena_nombre = '';

    -- Las referencias entre propietarios son valores de auditoría. Su validación
    -- de cadena ocurre por HTTP; ninguna eliminación externa debe borrar trabajos.
    DO $$
    DECLARE fk RECORD;
    BEGIN
        FOR fk IN SELECT conname FROM pg_constraint
            WHERE contype = 'f' AND conrelid = 'scraper.trabajos_scraper'::regclass
            AND confrelid IN ('scraper.cadenas_supermercado'::regclass, 'api.usuarios'::regclass)
        LOOP
            EXECUTE format('ALTER TABLE scraper.trabajos_scraper DROP CONSTRAINT %I', fk.conname);
        END LOOP;
    END $$;
    COMMENT ON COLUMN scraper.trabajos_scraper.cadena_id IS 'ID externo de Catálogo, validado por HTTP al crear el trabajo; sin cascada entre dominios';
    COMMENT ON COLUMN scraper.trabajos_scraper.cadena_nombre IS 'Snapshot de Catálogo al crear el trabajo; conserva la auditoría sin consultas cruzadas';
    COMMENT ON COLUMN scraper.trabajos_scraper.disparado_por_usuario_id IS 'UUID externo de auditoría; no acredita identidad ni autorización y no tiene FK entre dominios';

    -- SUP-240: el motor de rutas es dueño de rutas.*. El dueño de una lista es el
    -- user_id del JWT de Identidad: sin FK hacia api.usuarios ni cascada entre dominios.
    DO $$
    DECLARE fk RECORD;
    BEGIN
        FOR fk IN SELECT conname FROM pg_constraint
            WHERE contype = 'f' AND conrelid = 'rutas.listas_compras'::regclass
            AND confrelid = 'api.usuarios'::regclass
        LOOP
            EXECUTE format('ALTER TABLE rutas.listas_compras DROP CONSTRAINT %I', fk.conname);
        END LOOP;
    END $$;
    COMMENT ON COLUMN rutas.listas_compras.usuario_id IS 'UUID externo de Identidad (claim user_id del JWT); sin FK ni cascada entre dominios';
    CREATE INDEX IF NOT EXISTS idx_listas_compras_usuario ON rutas.listas_compras (usuario_id, actualizada_el DESC);
    CREATE INDEX IF NOT EXISTS idx_articulos_lista_compras_lista ON rutas.articulos_lista_compras (lista_id);

    -- Estos nombres son exclusivos del runtime. No se reutilizan administradores,
    -- propietarios de objetos o roles con membresías que permitan SET ROLE.
    DO $$
    DECLARE role_name TEXT; role_id OID;
    BEGIN
        FOREACH role_name IN ARRAY ARRAY['app_identity','app_scraping','app_catalogo','app_rutas'] LOOP
            SELECT oid INTO role_id FROM pg_roles WHERE rolname = role_name;
            IF role_id IS NULL THEN
                EXECUTE format('CREATE ROLE %I NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', role_name);
                SELECT oid INTO role_id FROM pg_roles WHERE rolname = role_name;
            END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE oid = role_id AND
                (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls OR rolinherit))
                OR EXISTS (SELECT 1 FROM pg_auth_members WHERE member = role_id)
                OR EXISTS (SELECT 1 FROM pg_class WHERE relowner = role_id)
                OR EXISTS (SELECT 1 FROM pg_proc WHERE proowner = role_id)
                OR EXISTS (SELECT 1 FROM pg_namespace WHERE nspowner = role_id)
                OR EXISTS (SELECT 1 FROM pg_database WHERE datdba = role_id) THEN
                RAISE EXCEPTION 'El rol % no es un rol runtime aislado; revisar con el operador', role_name;
            END IF;
            EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), role_name);
            EXECUTE format('REVOKE CREATE ON DATABASE %I FROM %I', current_database(), role_name);
            EXECUTE format('ALTER ROLE %I SET search_path = pg_catalog', role_name);
        END LOOP;
    END $$;

    REVOKE ALL PRIVILEGES ON SCHEMA api, scraper, rutas FROM app_identity, app_scraping, app_catalogo, app_rutas;
    REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api, scraper, rutas FROM app_identity, app_scraping, app_catalogo, app_rutas;
    REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA api, scraper, rutas FROM app_identity, app_scraping, app_catalogo, app_rutas;
    ALTER DEFAULT PRIVILEGES IN SCHEMA api, scraper, rutas REVOKE ALL ON TABLES FROM app_identity, app_scraping, app_catalogo, app_rutas;
    ALTER DEFAULT PRIVILEGES IN SCHEMA api, scraper, rutas REVOKE ALL ON SEQUENCES FROM app_identity, app_scraping, app_catalogo, app_rutas;

    GRANT USAGE ON SCHEMA api TO app_identity;
    GRANT SELECT, INSERT, UPDATE ON api.usuarios TO app_identity;
    -- SUP-184: requiere 05_tokens_recuperacion.sql. Sin DELETE: la limpieza es del operador.
    GRANT SELECT, INSERT, UPDATE ON api.tokens_recuperacion TO app_identity;
    -- SUP-239: CRUD de direcciones del usuario. DELETE es necesario porque la dirección
    -- es un dato del propio usuario, que puede eliminarla. La tabla viene de 01 y sus
    -- columnas nuevas de 11; este grant no depende de 11, así que sobrevive a re-ejecutar 06.
    GRANT SELECT, INSERT, UPDATE, DELETE ON api.direcciones_usuario TO app_identity;
    -- SUP-242: 08 crea api.auditoria_admin_usuarios después de este script. Si ya
    -- existe (re-ejecución de 06 en una base migrada), se restauran sus grants para
    -- que la auditoría administrativa siga operativa. Sin DELETE ni UPDATE.
    DO $$
    BEGIN
        IF to_regclass('api.auditoria_admin_usuarios') IS NOT NULL THEN
            EXECUTE 'GRANT SELECT, INSERT ON api.auditoria_admin_usuarios TO app_identity';
            EXECUTE 'GRANT USAGE, SELECT ON SEQUENCE api.auditoria_admin_usuarios_id_seq TO app_identity';
        END IF;
    END $$;

    GRANT USAGE ON SCHEMA scraper TO app_scraping;
    GRANT SELECT, INSERT, UPDATE ON scraper.trabajos_scraper,
        scraper.entregas_ingesta, scraper.entregas_trabajos TO app_scraping;
    -- SUP-270 purga sólo ejecuciones de trabajos terminales, no el ledger de ingesta.
    GRANT DELETE ON scraper.entregas_trabajos TO app_scraping;

    GRANT USAGE ON SCHEMA scraper TO app_catalogo;
    GRANT SELECT, INSERT, UPDATE ON scraper.productos_crudos TO app_catalogo;
    GRANT SELECT, INSERT ON scraper.cadenas_supermercado TO app_catalogo;
    -- SUP-243: la administración de fuentes sólo modifica el flag de activación.
    GRANT UPDATE (esta_activa) ON scraper.cadenas_supermercado TO app_catalogo;
    GRANT SELECT, INSERT ON scraper.sucursales_supermercado, scraper.capturas_precios,
        scraper.lotes_catalogo TO app_catalogo;
    GRANT USAGE ON SEQUENCE scraper.cadenas_supermercado_id_seq,
        scraper.sucursales_supermercado_id_seq, scraper.capturas_precios_id_seq TO app_catalogo;

    -- SUP-240: CRUD de listas. SUP-327: Motor también agrega, cambia y quita
    -- artículos (11_articulos_lista_producto.sql reaplica estos grants en bases
    -- existentes). Borrar una lista elimina sus artículos por la FK interna.
    GRANT USAGE ON SCHEMA rutas TO app_rutas;
    GRANT SELECT, INSERT, UPDATE, DELETE ON rutas.listas_compras TO app_rutas;
    GRANT SELECT, INSERT, UPDATE, DELETE ON rutas.articulos_lista_compras TO app_rutas;
    GRANT USAGE ON SEQUENCE rutas.articulos_lista_compras_id_seq TO app_rutas;

    -- 12 y 14 se ejecutan después en bases nuevas; conservar sus grants al re-ejecutar 06.
    DO $$
    BEGIN
        IF to_regclass('rutas.lotes_articulos_aplicados') IS NOT NULL THEN
            GRANT SELECT, INSERT ON rutas.lotes_articulos_aplicados TO app_rutas;
        END IF;
        IF to_regclass('rutas.carritos') IS NOT NULL THEN
            GRANT SELECT, INSERT, UPDATE ON rutas.carritos TO app_rutas;
        END IF;
    END $$;

    -- Fallar si concesiones públicas o defaults de otros operadores abren tablas
    -- fuera de la matriz. No revocar permisos de IA/rutas u otros usuarios existentes.
    DO $$
    DECLARE role_name TEXT; relation RECORD; privilege_name TEXT; permitted TEXT[];
    BEGIN
        FOREACH role_name IN ARRAY ARRAY['app_identity','app_scraping','app_catalogo','app_rutas'] LOOP
            permitted := CASE role_name
                WHEN 'app_identity' THEN ARRAY['api.usuarios','api.tokens_recuperacion','api.auditoria_admin_usuarios','api.direcciones_usuario']
                WHEN 'app_scraping' THEN ARRAY['scraper.trabajos_scraper','scraper.entregas_ingesta','scraper.entregas_trabajos']
                WHEN 'app_rutas' THEN ARRAY['rutas.listas_compras','rutas.articulos_lista_compras','rutas.lotes_articulos_aplicados','rutas.carritos']
                ELSE ARRAY['scraper.cadenas_supermercado','scraper.sucursales_supermercado','scraper.productos_crudos','scraper.capturas_precios','scraper.lotes_catalogo'] END;
            FOR relation IN SELECT format('%I.%I', n.nspname, c.relname) AS name, c.oid
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname IN ('api','scraper','rutas') AND c.relkind IN ('r','p','v','m','f')
            LOOP
                FOREACH privilege_name IN ARRAY ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER'] LOOP
                    IF (has_table_privilege(role_name, relation.oid, privilege_name)
                        OR (privilege_name IN ('SELECT','INSERT','UPDATE','REFERENCES')
                            AND has_any_column_privilege(role_name, relation.oid, privilege_name)))
                        AND (NOT relation.name = ANY(permitted) OR privilege_name IN ('TRUNCATE','REFERENCES','TRIGGER')
                            OR (privilege_name = 'DELETE' AND NOT ((role_name = 'app_scraping' AND relation.name = 'scraper.entregas_trabajos')
                                OR (role_name = 'app_rutas' AND relation.name IN ('rutas.listas_compras', 'rutas.articulos_lista_compras'))
                                OR (role_name = 'app_identity' AND relation.name = 'api.direcciones_usuario')))
                            OR (role_name = 'app_catalogo' AND privilege_name = 'UPDATE' AND relation.name NOT IN ('scraper.productos_crudos', 'scraper.cadenas_supermercado'))
                            OR (role_name = 'app_catalogo' AND privilege_name = 'UPDATE'
                                AND relation.name = 'scraper.cadenas_supermercado'
                                AND has_table_privilege(role_name, relation.oid, 'UPDATE'))) THEN
                        RAISE EXCEPTION 'Privilegio efectivo inesperado: % % %; revisar PUBLIC/defaults', role_name, privilege_name, relation.name;
                    END IF;
                END LOOP;
            END LOOP;
            FOR relation IN SELECT format('%I.%I', n.nspname, c.relname) AS name, c.oid
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname IN ('api','scraper','rutas') AND c.relkind = 'S'
            LOOP
                FOREACH privilege_name IN ARRAY ARRAY['USAGE','SELECT','UPDATE'] LOOP
                    IF has_sequence_privilege(role_name, relation.oid, privilege_name)
                        AND NOT (
                            (role_name = 'app_catalogo' AND privilege_name = 'USAGE'
                                AND relation.name IN ('scraper.cadenas_supermercado_id_seq','scraper.sucursales_supermercado_id_seq','scraper.capturas_precios_id_seq'))
                            OR (role_name = 'app_identity' AND privilege_name IN ('USAGE','SELECT')
                                AND relation.name = 'api.auditoria_admin_usuarios_id_seq')
                            OR (role_name = 'app_rutas' AND privilege_name = 'USAGE'
                                AND relation.name = 'rutas.articulos_lista_compras_id_seq')
                        ) THEN
                        RAISE EXCEPTION 'Privilegio efectivo inesperado: % % %; revisar secuencias', role_name, privilege_name, relation.name;
                    END IF;
                END LOOP;
            END LOOP;
            IF has_schema_privilege(role_name, 'api', 'CREATE') OR has_schema_privilege(role_name, 'scraper', 'CREATE')
                OR has_schema_privilege(role_name, 'rutas', 'CREATE') OR has_schema_privilege(role_name, 'public', 'CREATE')
                OR has_database_privilege(role_name, current_database(), 'CREATE') THEN
                RAISE EXCEPTION 'El rol % puede crear objetos; revisar privilegios públicos', role_name;
            END IF;
        END LOOP;
        IF EXISTS (SELECT 1 FROM pg_default_acl d, LATERAL aclexplode(d.defaclacl) a
            WHERE d.defaclobjtype IN ('r','S') AND (a.grantee = 0 OR a.grantee IN
                (SELECT oid FROM pg_roles WHERE rolname IN ('app_identity','app_scraping','app_catalogo','app_rutas')))) THEN
            RAISE EXCEPTION 'Hay defaults de tablas/secuencias para PUBLIC o roles runtime; revisar con el operador';
        END IF;
    END $$;
    COMMIT;
  07_respuestas_bloqueadas.sql: |
    -- Migración aditiva para trabajos que ya existen en volúmenes PostgreSQL.
    -- En una instalación nueva la columna ya la crea 02_schema_scraper.sql.
    ALTER TABLE scraper.trabajos_scraper
        ADD COLUMN IF NOT EXISTS respuestas_bloqueadas INTEGER DEFAULT 0;
  07_runtime_credentials.sh: |
    #!/usr/bin/env bash
    # Sólo inicialización de un volumen nuevo. Para uno existente, ejecutar
    # expresamente tras 06_propiedad_permisos.sql con el operador PostgreSQL.
    # El entrypoint puede ejecutar o sourcear este archivo (ConfigMap 0755).
    # El subshell evita modificar sus opciones/variables cuando se sourcea.
    (
    set -euo pipefail
    for credential in IDENTITY_DB_PASSWORD SCRAPING_DB_PASSWORD CATALOGO_DB_PASSWORD; do
      credential_value=${!credential:-}
      if (( ${#credential_value} < 32 )); then
        echo "$credential debe contener al menos 32 caracteres." >&2
        exit 1
      fi
    done
    unset credential_value
    if [[ "$IDENTITY_DB_PASSWORD" == "$SCRAPING_DB_PASSWORD" || "$IDENTITY_DB_PASSWORD" == "$CATALOGO_DB_PASSWORD" ||
          "$SCRAPING_DB_PASSWORD" == "$CATALOGO_DB_PASSWORD" || "$IDENTITY_DB_PASSWORD" == "${POSTGRES_PASSWORD:-}" ||
          "$SCRAPING_DB_PASSWORD" == "${POSTGRES_PASSWORD:-}" || "$CATALOGO_DB_PASSWORD" == "${POSTGRES_PASSWORD:-}" ]]; then
      echo 'Las tres contraseñas runtime deben ser distintas entre sí y del administrador.' >&2
      exit 1
    fi
    # SUP-240: el motor de rutas es opcional; sin RUTAS_DB_PASSWORD, app_rutas queda sin LOGIN.
    rutas_password=${RUTAS_DB_PASSWORD:-}
    if [[ -n "$rutas_password" ]]; then
      if (( ${#rutas_password} < 32 )); then
        echo "RUTAS_DB_PASSWORD debe contener al menos 32 caracteres." >&2
        exit 1
      fi
      for other in "$IDENTITY_DB_PASSWORD" "$SCRAPING_DB_PASSWORD" "$CATALOGO_DB_PASSWORD" "${POSTGRES_PASSWORD:-}"; do
        if [[ "$rutas_password" == "$other" ]]; then
          echo 'RUTAS_DB_PASSWORD debe ser distinta de las demás contraseñas.' >&2
          exit 1
        fi
      done
    fi
    unset rutas_password other
    psql -X --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
    \getenv identity_password IDENTITY_DB_PASSWORD
    \getenv scraping_password SCRAPING_DB_PASSWORD
    \getenv catalogo_password CATALOGO_DB_PASSWORD
    \set rutas_password ''
    \getenv rutas_password RUTAS_DB_PASSWORD
    BEGIN;
    SET LOCAL password_encryption = 'scram-sha-256';
    SELECT format('ALTER ROLE app_identity LOGIN PASSWORD %L', :'identity_password') \gexec
    SELECT format('ALTER ROLE app_scraping LOGIN PASSWORD %L', :'scraping_password') \gexec
    SELECT format('ALTER ROLE app_catalogo LOGIN PASSWORD %L', :'catalogo_password') \gexec
    SELECT format('ALTER ROLE app_rutas LOGIN PASSWORD %L', :'rutas_password') WHERE :'rutas_password' <> '' \gexec
    COMMIT;
    SQL
    )
  08_grants_catalogo_fuentes.sql: |
    -- ============================================================================
    -- SUP-243: Concesión de UPDATE acotado a app_catalogo en cadenas de scraping
    -- Permite que Catálogo gestione únicamente el flag esta_activa de las fuentes.
    -- El 06 vigente ya incluye este GRANT; este script lo reaplica de forma
    -- idempotente en bases que aplicaron una versión anterior de la migración.
    -- ============================================================================

    BEGIN;
    SET LOCAL statement_timeout = '30s';

    -- Retirar un grant de tabla completa de versiones anteriores antes de acotarlo.
    REVOKE UPDATE ON scraper.cadenas_supermercado FROM app_catalogo;
    GRANT UPDATE (esta_activa) ON scraper.cadenas_supermercado TO app_catalogo;

    COMMIT;
  08_normalizar_rol_admin_y_auditoria.sql: |
    -- SUP-242: normalizar el alias histórico de rol y habilitar auditoría administrativa.
    -- Aplicar después de 06_propiedad_permisos.sql. Es idempotente.

    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    -- El alias "administrador" deja de existir como valor de negocio: se persiste
    -- siempre como "admin". Desde 10_restringir_rol_usuarios.sql la base rechaza
    -- cualquier rol fuera de admin, colaborador y registrado.
    UPDATE api.usuarios
    SET rol = 'admin'
    WHERE LOWER(TRIM(rol)) = 'administrador'
      AND rol <> 'admin';

    CREATE TABLE IF NOT EXISTS api.auditoria_admin_usuarios (
        id          BIGSERIAL PRIMARY KEY,
        actor_id    UUID NOT NULL,
        objetivo_id UUID NOT NULL,
        cambios     JSONB NOT NULL,
        creado_el   TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_auditoria_admin_usuarios_objetivo
        ON api.auditoria_admin_usuarios (objetivo_id, creado_el DESC);

    GRANT SELECT, INSERT ON api.auditoria_admin_usuarios TO app_identity;
    GRANT USAGE, SELECT ON SEQUENCE api.auditoria_admin_usuarios_id_seq TO app_identity;

    COMMIT;
  09_plan_y_ultimo_acceso.sql: |
    -- SUP-242: plan comercial y último acceso en api.usuarios.
    -- Aplicar después de 08_normalizar_rol_admin_y_auditoria.sql. Es idempotente.
    --
    -- Se ejecuta en dos pasos transaccionales separados a propósito: el
    -- AccessExclusiveLock que toman ALTER TABLE ADD COLUMN / DROP-ADD CONSTRAINT
    -- se libera al hacer COMMIT. La validación del CHECK (escaneo secuencial) se
    -- hace después, en su propia transacción implícita, con
    -- ShareUpdateExclusiveLock, que permite SELECT/INSERT/UPDATE/DELETE.

    -- Paso 1/2: DDL de metadatos. Sólo bloqueos breves.
    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    -- En una base nueva ambas columnas se agregan en una operación de metadatos
    -- (PG 11+), sin reescribir la tabla. Si `plan` ya existía nullable, se rellena
    -- una sola vez y luego se fija NOT NULL.
    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_schema = 'api' AND table_name = 'usuarios' AND column_name = 'plan'
        ) THEN
            ALTER TABLE api.usuarios ADD COLUMN plan VARCHAR(20) NOT NULL DEFAULT 'basico';
        ELSE
            ALTER TABLE api.usuarios ALTER COLUMN plan SET DEFAULT 'basico';
            UPDATE api.usuarios SET plan = 'basico' WHERE plan IS NULL OR BTRIM(plan) = '';
            ALTER TABLE api.usuarios ALTER COLUMN plan SET NOT NULL;
        END IF;
    END $$;

    ALTER TABLE api.usuarios
        ADD COLUMN IF NOT EXISTS ultimo_acceso TIMESTAMPTZ;

    -- NOT VALID evita validar toda la tabla bajo AccessExclusiveLock. La
    -- validación real ocurre en el paso 2, ya sin ese lock retenido.
    ALTER TABLE api.usuarios
        DROP CONSTRAINT IF EXISTS usuarios_plan_check;
    ALTER TABLE api.usuarios
        ADD CONSTRAINT usuarios_plan_check CHECK (plan IN ('basico', 'premium')) NOT VALID;

    COMMIT;

    -- Paso 2/2: validación fuera de la transacción anterior. Toma
    -- ShareUpdateExclusiveLock y permite seguir operando durante el escaneo.
    -- Re-ejecutar sobre una constraint ya validada es un no-op rápido.
    SET lock_timeout = '5s';
    SET statement_timeout = '0';

    ALTER TABLE api.usuarios VALIDATE CONSTRAINT usuarios_plan_check;
  10_restringir_rol_usuarios.sql: |
    -- SUP-347: api.usuarios.rol sólo admite los tres roles vigentes.
    -- Aplicar después de 09_plan_y_ultimo_acceso.sql. Es idempotente.
    --
    -- Hasta ahora la columna aceptaba cualquier texto, y por eso Identidad
    -- conservaba en el código el alias histórico "administrador". Con esta
    -- restricción la base deja de aceptar un rol que el servicio no reconoce, y el
    -- código ya no necesita traducir alias. Identidad comprueba al arrancar que la
    -- restricción exista.
    --
    -- Igual que la 09, va en dos pasos: el DDL con un bloqueo breve y la
    -- validación (que recorre la tabla) en otra transacción, sin retener el
    -- AccessExclusiveLock.

    -- Paso 1/2: normalizar los datos y agregar la restricción sin validar.
    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    -- Repite la normalización de la 08 por si esa no se aplicó, y corrige además
    -- mayúsculas y espacios en los roles vigentes.
    UPDATE api.usuarios SET rol = 'admin'
    WHERE LOWER(BTRIM(rol)) = 'administrador';

    UPDATE api.usuarios SET rol = LOWER(BTRIM(rol))
    WHERE LOWER(BTRIM(rol)) IN ('admin', 'colaborador', 'registrado')
      AND rol <> LOWER(BTRIM(rol));

    -- Cualquier otro valor no tiene una traducción segura: se aborta para que un
    -- operador lo revise en vez de asignar un rol a ciegas.
    DO $$
    DECLARE
        desconocidos BIGINT;
    BEGIN
        SELECT COUNT(*) INTO desconocidos FROM api.usuarios
        WHERE rol NOT IN ('admin', 'colaborador', 'registrado');
        IF desconocidos > 0 THEN
            RAISE EXCEPTION '% filas de api.usuarios tienen un rol desconocido; corregirlas antes de aplicar 10', desconocidos;
        END IF;
    END $$;

    ALTER TABLE api.usuarios
        DROP CONSTRAINT IF EXISTS usuarios_rol_check;
    ALTER TABLE api.usuarios
        ADD CONSTRAINT usuarios_rol_check CHECK (rol IN ('admin', 'colaborador', 'registrado')) NOT VALID;

    COMMIT;

    -- Paso 2/2: validar fuera de la transacción anterior. Permite seguir leyendo y
    -- escribiendo durante el recorrido; sobre una restricción ya validada es un no-op.
    SET lock_timeout = '5s';
    SET statement_timeout = '0';

    ALTER TABLE api.usuarios VALIDATE CONSTRAINT usuarios_rol_check;
  11_articulos_lista_producto.sql: |
    -- SUP-327: los artículos de lista identifican el producto por el UUID que publica
    -- Catálogo (scraper.productos_crudos.id), según docs/Contratos/CONTRATO_ARTICULOS_LISTA.md.
    -- Aplicar después de 10. Idempotente: se puede re-ejecutar en una base existente.
    --
    -- - producto_id no lleva FK: el producto pertenece a Catálogo y Motor no consulta
    --   sus tablas. La existencia y disponibilidad se validan por HTTP.
    -- - producto_normalizado_id se elimina con su FK hacia api.productos_normalizados,
    --   tabla que nunca se llenó.
    -- - Filas previas: se conservan con producto_id NULL (no resolubles) en vez de
    --   inventarles un producto. Por eso producto_id no lleva CHECK: un CHECK NOT
    --   VALID también se evalúa al modificar una fila e impediría marcar como
    --   comprado un artículo previo. Motor exige producto_id en cada alta.
    -- - El CHECK de cantidad es NOT VALID para que solo aplique a filas nuevas o
    --   modificadas.

    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    ALTER TABLE rutas.articulos_lista_compras ADD COLUMN IF NOT EXISTS producto_id UUID;
    ALTER TABLE rutas.articulos_lista_compras DROP COLUMN IF EXISTS producto_normalizado_id;

    -- Versiones previas de esta migración agregaban un CHECK de producto_id.
    ALTER TABLE rutas.articulos_lista_compras DROP CONSTRAINT IF EXISTS articulos_lista_producto_requerido;

    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_constraint
                       WHERE conrelid = 'rutas.articulos_lista_compras'::regclass
                         AND conname = 'articulos_lista_cantidad_positiva') THEN
            ALTER TABLE rutas.articulos_lista_compras
                ADD CONSTRAINT articulos_lista_cantidad_positiva CHECK (cantidad >= 1) NOT VALID;
        END IF;
    END $$;

    -- "Sumar si ya existe": un producto aparece una sola vez por lista. Los NULL
    -- previos no chocan entre sí.
    CREATE UNIQUE INDEX IF NOT EXISTS uq_articulos_lista_producto
        ON rutas.articulos_lista_compras (lista_id, producto_id);

    -- Motor agrega, cambia y quita artículos. La secuencia la usa el SERIAL de id.
    GRANT SELECT, INSERT, UPDATE, DELETE ON rutas.articulos_lista_compras TO app_rutas;
    GRANT USAGE ON SEQUENCE rutas.articulos_lista_compras_id_seq TO app_rutas;

    COMMIT;
  11_direcciones_usuario.sql: |
    -- SUP-239: direcciones guardadas del usuario (CRUD en Identidad).
    -- Aplicar después de 06 (crea el rol app_identity) y 10. Es idempotente.
    --
    -- La tabla api.direcciones_usuario existe desde 01_schema_api.sql pero nunca
    -- tuvo código ni permisos. Este script la adapta al contrato del CRUD:
    --   * comuna: columna nueva. Queda NULLABLE en la base porque una fila previa
    --     no tiene de dónde obtenerla; la API la exige al crear y al actualizar.
    --   * lat/lon: pasan a ser opcionales (una dirección puede guardarse sin
    --     geocodificar), pero se exigen ambas o ninguna y dentro de rango.
    --   * creado_el: columna nueva (NOT NULL DEFAULT now(): sólo metadatos en
    --     PostgreSQL 11+). Da un orden estable y permite promover la dirección más
    --     antigua al borrar la principal. Las filas previas quedan con la fecha de
    --     esta migración y se desempatan por id.
    --   * es_principal: NOT NULL DEFAULT false e índice único parcial que garantiza
    --     una sola principal por usuario, incluso ante peticiones concurrentes. Los
    --     datos previos se normalizan: duplicadas se desmarcan (queda la más antigua)
    --     y un usuario con direcciones y sin principal recibe la más antigua.
    --   * Permisos: app_identity recibe exactamente SELECT, INSERT, UPDATE y DELETE
    --     sobre esta tabla. Ningún otro rol runtime tiene ni necesita acceso: el
    --     motor de rutas obtendrá el origen por HTTP, no por SQL cruzado.
    --
    -- Va en dos pasos, igual que 09 y 10: el DDL con bloqueos breves y la validación
    -- de los CHECK (que recorre la tabla) en otra transacción, sin retener el
    -- AccessExclusiveLock durante el escaneo.

    -- Paso 1/2: DDL de metadatos y permisos.
    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    ALTER TABLE api.direcciones_usuario
        ADD COLUMN IF NOT EXISTS comuna VARCHAR(100);
    ALTER TABLE api.direcciones_usuario
        ADD COLUMN IF NOT EXISTS creado_el TIMESTAMPTZ NOT NULL DEFAULT now();

    ALTER TABLE api.direcciones_usuario ALTER COLUMN lat DROP NOT NULL;
    ALTER TABLE api.direcciones_usuario ALTER COLUMN lon DROP NOT NULL;

    -- Una fila previa con es_principal NULL no es principal. Se fija NOT NULL sólo
    -- después de normalizarla, para que la migración no falle con datos existentes.
    UPDATE api.direcciones_usuario SET es_principal = false WHERE es_principal IS NULL;
    ALTER TABLE api.direcciones_usuario ALTER COLUMN es_principal SET DEFAULT false;
    ALTER TABLE api.direcciones_usuario ALTER COLUMN es_principal SET NOT NULL;

    -- Si un usuario ya tuviera varias principales (el esquema original no lo
    -- impedía), se conserva la más antigua y se desmarcan las demás; de lo
    -- contrario el índice único parcial no podría crearse.
    WITH ordenadas AS (
        SELECT id,
               ROW_NUMBER() OVER (PARTITION BY usuario_id ORDER BY creado_el, id) AS posicion
        FROM api.direcciones_usuario
        WHERE es_principal
    )
    UPDATE api.direcciones_usuario AS direccion
    SET es_principal = false
    FROM ordenadas
    WHERE direccion.id = ordenadas.id AND ordenadas.posicion > 1;

    -- Un usuario con direcciones previas pero ninguna principal (todas NULL/false)
    -- recibe como principal la más antigua, para cumplir la invariante "si tiene
    -- direcciones, tiene una principal" que mantiene la API. Idempotente: tras la
    -- primera pasada ya no hay usuarios sin principal.
    WITH candidatas AS (
        SELECT DISTINCT ON (usuario_id) id
        FROM api.direcciones_usuario AS direccion
        WHERE NOT EXISTS (
            SELECT 1 FROM api.direcciones_usuario AS otra
            WHERE otra.usuario_id = direccion.usuario_id AND otra.es_principal)
        ORDER BY usuario_id, creado_el, id
    )
    UPDATE api.direcciones_usuario AS direccion
    SET es_principal = true
    FROM candidatas
    WHERE direccion.id = candidatas.id;

    CREATE UNIQUE INDEX IF NOT EXISTS uq_direcciones_usuario_principal
        ON api.direcciones_usuario (usuario_id) WHERE es_principal;
    CREATE INDEX IF NOT EXISTS idx_direcciones_usuario_usuario
        ON api.direcciones_usuario (usuario_id);

    -- NOT VALID evita validar toda la tabla bajo AccessExclusiveLock; la validación
    -- real ocurre en el paso 2.
    ALTER TABLE api.direcciones_usuario DROP CONSTRAINT IF EXISTS direcciones_usuario_coordenadas_par_check;
    ALTER TABLE api.direcciones_usuario
        ADD CONSTRAINT direcciones_usuario_coordenadas_par_check
        CHECK ((lat IS NULL) = (lon IS NULL)) NOT VALID;

    ALTER TABLE api.direcciones_usuario DROP CONSTRAINT IF EXISTS direcciones_usuario_coordenadas_rango_check;
    ALTER TABLE api.direcciones_usuario
        ADD CONSTRAINT direcciones_usuario_coordenadas_rango_check
        CHECK ((lat IS NULL OR lat BETWEEN -90 AND 90) AND (lon IS NULL OR lon BETWEEN -180 AND 180)) NOT VALID;

    -- Una comuna presente no puede ser sólo espacios. Se permite NULL por las filas previas.
    ALTER TABLE api.direcciones_usuario DROP CONSTRAINT IF EXISTS direcciones_usuario_comuna_check;
    ALTER TABLE api.direcciones_usuario
        ADD CONSTRAINT direcciones_usuario_comuna_check
        CHECK (comuna IS NULL OR BTRIM(comuna) <> '') NOT VALID;

    -- Permisos mínimos. Se exige el rol creado por 06 en vez de crearlo aquí: este
    -- script no define roles ni sus atributos.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_identity') THEN
            RAISE EXCEPTION 'No existe el rol app_identity; aplicar 06_propiedad_permisos.sql antes de 11';
        END IF;
    END $$;
    GRANT SELECT, INSERT, UPDATE, DELETE ON api.direcciones_usuario TO app_identity;

    COMMIT;

    -- Paso 2/2: validar fuera de la transacción anterior. Sobre restricciones ya
    -- validadas es un no-op rápido.
    SET lock_timeout = '5s';
    SET statement_timeout = '0';

    ALTER TABLE api.direcciones_usuario VALIDATE CONSTRAINT direcciones_usuario_coordenadas_par_check;
    ALTER TABLE api.direcciones_usuario VALIDATE CONSTRAINT direcciones_usuario_coordenadas_rango_check;
    ALTER TABLE api.direcciones_usuario VALIDATE CONSTRAINT direcciones_usuario_comuna_check;
  12_lotes_articulos_idempotencia.sql: |
    -- SUP-318: claves Idempotency-Key del agregado en lote de artículos
    -- (POST /api/v1/listas/{lista_id}/articulos/lote, CONTRATO_ARTICULOS_LISTA.md §3.4).
    -- Aplicar después de 11. Idempotente: se puede re-ejecutar en una base existente.
    --
    -- - Una fila por lote aplicado: si el frontend reintenta con la misma clave,
    --   Motor la encuentra y no vuelve a sumar las cantidades.
    -- - huella es el SHA-256 (hex) del lote normalizado: la misma clave con otro
    --   contenido se rechaza en vez de devolver un resultado que no corresponde.
    -- - Las filas se borran con su lista (FK interna del esquema rutas). La acción
    --   de la FK corre con permisos del dueño, por eso app_rutas no necesita DELETE.

    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    CREATE TABLE IF NOT EXISTS rutas.lotes_articulos_aplicados (
        lista_id UUID NOT NULL REFERENCES rutas.listas_compras(id) ON DELETE CASCADE,
        clave VARCHAR(128) NOT NULL,
        huella CHAR(64) NOT NULL,
        creado_el TIMESTAMP NOT NULL DEFAULT NOW(),
        PRIMARY KEY (lista_id, clave)
    );

    -- Motor sólo consulta y registra claves; nunca las modifica ni las borra.
    GRANT SELECT, INSERT ON rutas.lotes_articulos_aplicados TO app_rutas;

    COMMIT;
  13_actualizar_sucursales_acuenta_cugat.sql: |
    -- SUP-317: sucursales físicas reales de A Cuenta y Cugat en Temuco y filtro
    -- geoespacial para precios comparables por sucursal.
    --
    -- Aplicar después de 04 (que crea las filas 5 y 6) y antes de init.sql, que
    -- respeta las filas existentes con ON CONFLICT DO NOTHING. Idempotente: se
    -- puede re-ejecutar sobre una base ya migrada.
    --
    -- Fuentes de los datos (no inventados):
    --   A Cuenta: PDF oficial "Locales y horarios SBA 2025", local
    --     "Manuel Antonio Matta 025, Temuco"; horario lun-sáb 08:00-21:30,
    --     domingo y feriados 08:30-21:00. Coordenada de OSM way 426693011
    --     (Supermercado Acuenta), datos © OpenStreetMap contributors, ODbL.
    --   Cugat: ficha oficial https://cugat.cl/ubicaciones/av-barros-arana-375-temuco
    --     "Av. Barros Arana 375, Temuco"; horario lun-sáb 08:00-21:00,
    --     domingo 08:30-17:30. Coordenada de OSM way 426439021 (Cugat),
    --     datos © OpenStreetMap contributors, ODbL.
    -- El esquema guarda un solo par de horarios: se consigna el de lunes a sábado
    -- y el domingo queda documentado aquí para no perderlo.

    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    -- init.sql corre después en una base nueva; crearla aquí permite aplicar la
    -- migración sola sobre un volumen existente que ya tenga las extensiones o no.
    CREATE EXTENSION IF NOT EXISTS postgis;

    UPDATE scraper.sucursales_supermercado
    SET nombre        = 'SuperBodega aCuenta Temuco Matta',
        direccion     = 'Manuel Antonio Matta 025',
        comuna        = 'Temuco',
        ciudad        = 'Temuco',
        lat           = -38.7338383,
        lon           = -72.5806422,
        hora_apertura = '08:00:00',
        hora_cierre   = '21:30:00'
    WHERE codigo_sucursal = 'ACUENTA-CENTRAL';

    UPDATE scraper.sucursales_supermercado
    SET nombre        = 'Cugat Temuco Barros Arana',
        direccion     = 'Av. Barros Arana 375',
        comuna        = 'Temuco',
        ciudad        = 'Temuco',
        lat           = -38.7385969,
        lon           = -72.5813372,
        hora_apertura = '08:00:00',
        hora_cierre   = '21:00:00'
    WHERE codigo_sucursal = 'CUGAT-CENTRAL';

    -- Índice funcional sobre geography: ST_DWithin en metros usa el índice GiST y
    -- no añade columnas a la tabla compartida con Control. El predicado parcial
    -- coincide con el WHERE del repositorio de Catálogo.
    CREATE INDEX IF NOT EXISTS idx_sucursales_supermercado_geo
        ON scraper.sucursales_supermercado
        USING GIST ((ST_SetSRID(ST_MakePoint(lon, lat), 4326)::geography))
        WHERE lat IS NOT NULL AND lon IS NOT NULL;

    COMMIT;
  14_carritos_persistentes.sql: |
    -- Carrito borrador por cuenta, separado de las listas confirmadas.
    -- Ejecutar como operador: no modifica listas ni datos de otros dominios.
    BEGIN;
    SET LOCAL lock_timeout = '5s';
    SET LOCAL statement_timeout = '60s';

    CREATE TABLE IF NOT EXISTS rutas.carritos (
        usuario_id UUID PRIMARY KEY,
        version BIGINT NOT NULL DEFAULT 0 CHECK (version >= 0),
        articulos JSONB NOT NULL DEFAULT '[]'::jsonb
            CHECK (jsonb_typeof(articulos) = 'array' AND jsonb_array_length(articulos) <= 100),
        envio JSONB CHECK (envio IS NULL OR jsonb_typeof(envio) = 'object'),
        ultimo_envio JSONB CHECK (ultimo_envio IS NULL OR jsonb_typeof(ultimo_envio) = 'object'),
        actualizado_el TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    COMMENT ON TABLE rutas.carritos IS 'Borrador por cuenta de Motor/Listas, con versión y envío recuperable; sin precios persistidos';
    COMMENT ON COLUMN rutas.carritos.usuario_id IS 'UUID externo de Identidad, obtenido sólo del JWT; sin FK entre dominios';
    -- No se elimina la fila al vaciar: la versión y el último resultado protegen reintentos.
    GRANT SELECT, INSERT, UPDATE ON rutas.carritos TO app_rutas;
    COMMIT;
  15_indices_busqueda_trigram.sql: |
    -- =======================================================
    -- Índice GIN trigram de SKU para scraper.productos_crudos
    -- =======================================================
    -- Ejecutar como operador (POSTGRES_USER). Idempotente: segura en bases nuevas y
    -- existentes. Complementa 03_indices_optimizacion.sql (que ya crea los índices
    -- trigram sobre titulo_crudo, marca_cruda y categoria_cruda) incorporando el
    -- índice de sku y actualizando las estadísticas del planificador con ANALYZE.

    -- ===== Extensión pg_trgm =====
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    -- ===== Índice GIN con gin_trgm_ops para SKU =====
    CREATE INDEX IF NOT EXISTS idx_productos_crudos_sku_trgm
        ON scraper.productos_crudos USING gin (sku gin_trgm_ops);

    -- ===== Actualización de estadísticas =====
    ANALYZE scraper.productos_crudos;
  16_desactivar_jit_roles_lectura.sql: |
    -- =======================================================
    -- Desactivar JIT en roles de consulta (app_catalogo, app_rutas)
    -- =======================================================
    -- Ejecutar como operador (POSTGRES_USER) después de 06_propiedad_permisos.sql.
    -- Idempotente: segura en bases nuevas y existentes.
    -- Motivo: con límite de CPU acotado en PostgreSQL, la compilación JIT sumaba
    -- ~1 s por consulta en Catálogo y Motor de rutas.

    -- ===== Configuración de roles runtime =====
    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_catalogo') THEN
            ALTER ROLE app_catalogo SET jit = off;
        END IF;

        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_rutas') THEN
            ALTER ROLE app_rutas SET jit = off;
        END IF;
    END
    $$;
  init.sql: |
    -- Inicialización de una base PostgreSQL + PostGIS nueva (SUP-370).
    --
    -- Este archivo sólo siembra CONFIGURACIÓN: las extensiones, los esquemas y las
    -- seis cadenas de supermercado con sus sucursales, con ids estables porque los
    -- humos (fixtures de Catálogo, ingesta, enrutamiento y control) y la ingesta
    -- del scraper los referencian por id (cadena 1 'Jumbo', sucursal 1, etc.).
    --
    -- NO siembra productos, precios, marcas, categorías ni mapeos de IA. Los
    -- productos y precios llegan por la ingesta del scraper, y los tests siembran
    -- sus propios datos (por ejemplo backend/catalogo/tests/fixtures.sql). Antes de
    -- SUP-370 este archivo cargaba 45 productos de demo de Jumbo; ese seed se retiró
    -- para que una base nueva no mezcle datos ficticios con datos reales.
    --
    -- Las sucursales 5 y 6 (A Cuenta y Cugat, tiendas en línea) tienen datos de
    -- ubicación provisionales (dirección y coordenadas del centro de Temuco); el
    -- pendiente está documentado en backend/catalogo/README.md.
    --
    -- Las bases ya desplegadas conservan los productos de demo anteriores: retirarlos
    -- requiere una migración autorizada, fuera del alcance de este archivo.

    -- ===== Extensiones y esquemas =====
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "postgis";

    CREATE SCHEMA IF NOT EXISTS api;
    CREATE SCHEMA IF NOT EXISTS scraper;
    CREATE SCHEMA IF NOT EXISTS rutas;

    COMMENT ON SCHEMA api IS 'Dominio 1 (Identidad, Usuarios) y Dominio 4 (Catálogo Maestro y Recetas)';
    COMMENT ON SCHEMA scraper IS 'Dominio 2 (Cadenas y Sucursales) y Dominio 3 (Extracción y Capturas de Precios)';
    COMMENT ON SCHEMA rutas IS 'Dominio 5 (Listas de Compras, Rutas Geoespaciales y Optimización TSP)';

    -- ===== Cadenas de supermercado (scraper.cadenas_supermercado) =====
    INSERT INTO scraper.cadenas_supermercado (id, nombre, url_sitio_web, url_logo, esta_activa) VALUES
    (1, 'Jumbo', 'https://www.jumbo.cl', '/logos/verdemart.png', true),
    (2, 'Lider', 'https://www.lider.cl', '/logos/superahorro.png', true),
    (3, 'Unimarc', 'https://www.unimarc.cl', '/logos/mercadia.png', true),
    (4, 'Santa Isabel', 'https://www.santaisabel.cl', '/logos/colmadoplus.png', true),
    (5, 'A Cuenta', 'https://www.acuenta.cl', '/logos/acuenta.png', true),
    (6, 'Cugat', 'https://cugat.cl', '/logos/cugat.png', true)
    ON CONFLICT (id) DO NOTHING;

    SELECT setval('scraper.cadenas_supermercado_id_seq', (SELECT MAX(id) FROM scraper.cadenas_supermercado));

    -- ===== Sucursales de supermercado (scraper.sucursales_supermercado) =====
    INSERT INTO scraper.sucursales_supermercado (id, cadena_id, codigo_sucursal, nombre, direccion, comuna, ciudad, lat, lon, hora_apertura, hora_cierre, esta_activa) VALUES
    (1, 1, 'JUMBO-LOS-PABLOS', 'Jumbo Los Pablos', 'Av. Los Pablos 01860', 'Temuco', 'Temuco', -38.74100000, -72.60000000, '08:30:00', '21:00:00', true),
    (2, 2, 'LIDER-PRIETO-NORTE', 'Lider Prieto Norte', 'Av. Caupolicán 0450', 'Temuco', 'Temuco', -38.73500000, -72.59000000, '08:00:00', '21:30:00', true),
    (3, 3, 'UNIMARC-ALEMANIA', 'Unimarc Av. Alemania', 'Av. Alemania 0655', 'Temuco', 'Temuco', -38.74500000, -72.61000000, '08:30:00', '21:00:00', true),
    (4, 4, 'SANTA-ISABEL-SAN-MARTIN', 'Santa Isabel San Martín', 'San Martín 0890', 'Temuco', 'Temuco', -38.73000000, -72.60500000, '08:30:00', '21:00:00', true),
    (5, 5, 'ACUENTA-CENTRAL', 'A Cuenta Online', 'Casa Matriz / Online', 'Temuco', 'Temuco', -38.73590000, -72.59040000, NULL, NULL, true),
    (6, 6, 'CUGAT-CENTRAL', 'Cugat Online', 'Casa Matriz / Online', 'Temuco', 'Temuco', -38.73590000, -72.59040000, NULL, NULL, true)
    ON CONFLICT (id) DO NOTHING;

    SELECT setval('scraper.sucursales_supermercado_id_seq', (SELECT MAX(id) FROM scraper.sucursales_supermercado));
