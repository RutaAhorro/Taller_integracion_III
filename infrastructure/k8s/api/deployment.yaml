apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - env:
        - name: PORT
          value: '8080'
        - name: SCRAPING_DB_URL
          valueFrom:
            secretKeyRef:
              key: DB_URL
              name: scraping-db-secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: db-secret
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: CATALOGO_INTERNAL_URL
          value: http://catalogo:8080
        - name: CATALOGO_INGEST_TIMEOUT
          value: 10s
        - name: CATALOGO_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: catalogo-internal-secret
              key: token
        image: ghcr.io/danirc2024/taller_integracion_iii-api:develop-refactor
        imagePullPolicy: Always
        name: api
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /_api/live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          limits:
            cpu: 250m
            memory: 500Mi
          requests:
            cpu: 50m
            memory: 64Mi
