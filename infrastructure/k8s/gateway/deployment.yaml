apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/danirc2024/taller_integracion_iii-gateway:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SCRAPING_URL
              value: http://control-scraping:8080
            - name: CATALOGO_URL
              value: http://catalogo:8080
            - name: IDENTIDAD_URL
              value: http://identidad:8080
            - name: GATEWAY_LISTEN_ADDR
              value: :8080
          envFrom:
            - configMapRef:
                name: gateway-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /_gateway/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_gateway/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /_gateway/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 96Mi
