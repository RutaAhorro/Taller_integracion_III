apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - image: redis:7-alpine
        args: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
        volumeMounts:
        - name: redis-data
          mountPath: /data
        name: redis
        ports:
        - containerPort: 6379
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 25m
            memory: 64Mi
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
