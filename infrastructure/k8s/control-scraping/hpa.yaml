apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-scraping-hpa
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: control-scraping}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
