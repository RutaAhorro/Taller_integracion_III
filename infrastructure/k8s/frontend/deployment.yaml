apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: ghcr.io/danirc2024/taller_integracion_iii-frontend:develop
        imagePullPolicy: Always
        name: frontend
        env:
        - name: VITE_API_URL
          value: "/api/v1"
        - name: VITE_IA_URL
          value: "/api/v1" # IA usa el mismo API Gateway en el cluster
        - name: VITE_GOOGLE_CLIENT_ID
          value: "832261851860-a1pu1rj9hejrref2tjq15h4hh8rr4snr.apps.googleusercontent.com"
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: 100m
            memory: 150Mi
          requests:
            cpu: 30m
            memory: 64Mi
