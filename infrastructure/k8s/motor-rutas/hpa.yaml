apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: motor-rutas-hpa
  labels:
    app: motor-rutas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: motor-rutas
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
