apiVersion: v1
kind: ConfigMap
metadata:
  name: identidad-config
data:
  # Completar orígenes reales del frontend antes del corte.
  CORS_ALLOWED_ORIGINS: ''
  IDENTIDAD_COOKIE_SECURE: 'true'
  # Obligatorio: vacío impide el arranque hasta completar el CIDR/IP de Gateway.
  IDENTIDAD_TRUSTED_PROXIES: ''
