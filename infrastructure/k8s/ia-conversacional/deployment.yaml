apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-conversacional
  labels:
    app: ia-conversacional
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ia-conversacional
  template:
    metadata:
      labels:
        app: ia-conversacional
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ia-conversacional
          image: ghcr.io/rutaahorro/taller_integracion_iii-ia-conversacional:develop
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: ia-conversacional-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: JWT_SECRET
            - name: CATALOGO_CONSULTA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalogo-internal-secret
                  key: consulta-token
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ia-conversacional-secret
                  key: GEMINI_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ia-conversacional-secret
                  key: GROQ_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            # A 100m de CPU, el arranque de FastAPI y la precarga inicial pueden superar 30s.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            # La IA precarga el catálogo al arrancar (lifespan).
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
