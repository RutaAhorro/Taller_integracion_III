apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogo-config
data:
  # Ajustar al esquema y dominio reales del frontend antes del despliegue.
  CORS_ALLOWED_ORIGINS: "http://miweb-vmatus.dev.censei.cl,https://miweb-vmatus.dev.censei.cl"
  DB_MAX_OPEN_CONNS: "10"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "30m"
  CATALOGO_MAX_PRODUCTOS_CONSULTA: "1000"
  # Recorte MVP: 2160h (90 días) para la instantánea de precios de demo; con scraping fresco volver a 48h.
  CATALOGO_DISPONIBILIDAD_ANTIGUEDAD_MAXIMA: "2160h"
