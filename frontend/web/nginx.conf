# Sirve la aplicación compilada, conserva las rutas de React y reenvía las solicitudes a la API.
server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de seguridad sin CSP para no interferir con Google OAuth ni fuentes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Devuelve la aplicación para las rutas que resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvío de solicitudes al servidor de la API.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché para archivos estáticos (opcional pero recomendado)
    # Nginx no hereda add_header de server cuando el bloque location define uno propio.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        # Cabeceras básicas de seguridad para archivos estáticos
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, no-transform";
    }
}
