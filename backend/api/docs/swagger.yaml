basePath: /
definitions:
  domain.ActualizarPerfilDTO:
    properties:
      correo:
        type: string
      direccion:
        type: string
      nombre_completo:
        type: string
      password:
        type: string
      telefono:
        type: string
    type: object
  domain.FinalizarTrabajoDTO:
    properties:
      elementos_extraidos:
        type: integer
      estado:
        description: '''completado'' o ''fallido'''
        type: string
      registro_errores:
        type: string
    required:
    - estado
    type: object
  domain.HistorialPrecioDTO:
    properties:
      capturado_el:
        type: string
      precio_normal:
        type: number
      precio_oferta:
        type: number
    type: object
  domain.IngestaLoteDTO:
    properties:
      codigo_sucursal:
        type: string
      productos:
        items:
          $ref: '#/definitions/domain.ProductoScrapeadoDTO'
        minItems: 1
        type: array
      sucursal_id:
        type: integer
      supermercado:
        type: string
    required:
    - productos
    type: object
  domain.IngestaResultadoDTO:
    properties:
      actualizados:
        type: integer
      errores:
        items:
          type: string
        type: array
      insertados:
        type: integer
      mensaje:
        type: string
      precios_registrados:
        type: integer
      sucursal_id:
        type: integer
      total_recibidos:
        type: integer
      trabajo_id:
        type: string
    type: object
  domain.IniciarTrabajoDTO:
    properties:
      cadena_id:
        type: integer
      disparado_por_usuario_id:
        type: string
      supermercado:
        type: string
    required:
    - cadena_id
    type: object
  domain.MetadatosPaginacionDTO:
    properties:
      limite:
        type: integer
      pagina_actual:
        type: integer
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  domain.PaginaProductosAdminDTO:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.ProductoAdminDTO'
        type: array
      limite:
        type: integer
      pagina_actual:
        type: integer
      paginacion:
        $ref: '#/definitions/domain.MetadatosPaginacionDTO'
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  domain.PaginaProductosDTO:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.ProductoDTO'
        type: array
      limite:
        type: integer
      pagina_actual:
        type: integer
      paginacion:
        $ref: '#/definitions/domain.MetadatosPaginacionDTO'
      total_paginas:
        type: integer
      total_registros:
        type: integer
    type: object
  domain.PerfilUsuarioDTO:
    properties:
      correo:
        type: string
      direccion:
        type: string
      esta_activo:
        type: boolean
      id:
        type: string
      mensaje:
        type: string
      nombre_completo:
        type: string
      rol:
        type: string
      telefono:
        type: string
    type: object
  domain.ProductoAdminDTO:
    properties:
      categoria:
        type: string
      en_oferta:
        type: boolean
      en_stock:
        type: boolean
      id:
        type: string
      marca:
        type: string
      nombre:
        type: string
      precio_normal:
        type: integer
      precio_oferta:
        type: integer
      sku:
        type: string
      sucursal_id:
        type: integer
      supermercado:
        type: string
      ultima_extraccion_el:
        type: string
      unidad:
        type: string
      url_imagen:
        type: string
    type: object
  domain.ProductoDTO:
    properties:
      categoria:
        type: string
      en_oferta:
        type: boolean
      en_stock:
        type: boolean
      id:
        type: string
      marca:
        type: string
      nombre:
        type: string
      precio:
        type: number
      precio_normal:
        type: number
      precio_oferta:
        type: number
      supermercado:
        type: string
      unidad:
        type: string
      url_imagen:
        type: string
    type: object
  domain.ProductoDetalleDTO:
    properties:
      categoria:
        type: string
      en_oferta:
        type: boolean
      en_stock:
        type: boolean
      historial:
        items:
          $ref: '#/definitions/domain.HistorialPrecioDTO'
        type: array
      id:
        type: string
      marca:
        type: string
      nombre:
        type: string
      precio:
        type: number
      precio_normal:
        type: number
      precio_oferta:
        type: number
      supermercado:
        type: string
      unidad:
        type: string
      url_imagen:
        type: string
    type: object
  domain.ProductoScrapeadoDTO:
    properties:
      categoria:
        type: string
      ean_gtin:
        type: string
      en_stock:
        type: boolean
      formato_crudo:
        type: string
      imagen:
        type: string
      marca:
        type: string
      mecanica_promocion:
        type: string
      metrica_unidad:
        type: string
      precio:
        type: number
      precio_normal:
        type: number
      precio_oferta:
        type: number
      precio_por_unidad:
        type: number
      precio_tarjeta:
        type: number
      producto:
        type: string
      sku:
        type: string
      url_imagen:
        type: string
      url_producto:
        type: string
    required:
    - precio_normal
    - producto
    - sku
    type: object
  domain.TrabajoScraperDTO:
    properties:
      cadena_id:
        type: integer
      cadena_nombre:
        type: string
      duracion_segundos:
        type: number
      elementos_extraidos:
        type: integer
      estado:
        type: string
      finalizado_el:
        type: string
      id:
        type: string
      iniciado_el:
        type: string
      registro_errores:
        type: string
    type: object
  handlers.GoogleLoginRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  handlers.LoginRequest:
    properties:
      correo:
        example: usuario.test@uct.cl
        type: string
      password:
        example: PasswordSegura123!
        type: string
    required:
    - correo
    - password
    type: object
  handlers.LoginResponse:
    properties:
      correo:
        example: usuario.test@uct.cl
        type: string
      esta_activo:
        example: true
        type: boolean
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      mensaje:
        example: Inicio de sesión exitoso.
        type: string
      nombre_completo:
        example: Vicente Matu
        type: string
      rol:
        example: registrado
        type: string
      url_avatar:
        example: https://ejemplo.com/avatar.jpg
        type: string
    type: object
  handlers.RegistroRequest:
    properties:
      correo:
        example: usuario.test@uct.cl
        type: string
      nombre_completo:
        example: Vicente Matu
        type: string
      password:
        example: PasswordSegura123!
        type: string
    required:
    - correo
    - nombre_completo
    - password
    type: object
  handlers.RegistroResponse:
    properties:
      correo:
        example: usuario.test@uct.cl
        type: string
      esta_activo:
        example: true
        type: boolean
      id:
        example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        type: string
      mensaje:
        example: Usuario registrado con éxito. Se requiere confirmar el correo electrónico
          antes de iniciar sesión.
        type: string
      nombre_completo:
        example: Vicente Matu
        type: string
      rol:
        example: registrado
        type: string
      token_verificacion:
        example: f81d4fae-7dec-11d0-a765-00a0c91e6bf6
        type: string
    type: object
  handlers.ejecutarScraperRequest:
    properties:
      producto_id:
        type: string
      producto_url:
        type: string
      spider:
        type: string
    type: object
  middleware.RespuestaError:
    properties:
      detalle:
        description: Información técnica u origen del error
        type: string
      estado:
        description: Código numérico del estado HTTP (400, 404, 500, etc.)
        type: integer
      mensaje:
        description: Mensaje descriptivo amigable para el cliente
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Gateway construida en Go con Gin
  title: API Gateway de Supermercados
  version: "1.0"
paths:
  /:
    get:
      description: Endpoint raíz para comprobar el estado de la API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Muestra mensaje de bienvenida
      tags:
      - root
  /api/v1/admin/productos:
    get:
      description: Obtiene listado paginado y filtrado de productos con datos técnicos
        de scraping para Superadmin
      parameters:
      - description: Búsqueda por texto libre
        in: query
        name: q
        type: string
      - description: 'Número de página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Cantidad de productos por página (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Filtrar por categoría
        in: query
        name: categoria
        type: string
      - description: Filtrar por supermercado o cadena
        in: query
        name: supermercado
        type: string
      - description: Filtrar por marca
        in: query
        name: marca
        type: string
      - description: Filtrar por SKU
        in: query
        name: sku
        type: string
      - description: Filtrar por disponibilidad de stock
        in: query
        name: en_stock
        type: boolean
      - description: Precio mínimo
        in: query
        name: precio_min
        type: number
      - description: Precio máximo
        in: query
        name: precio_max
        type: number
      - description: Filtrar solo productos en oferta
        in: query
        name: en_oferta
        type: boolean
      - description: Criterio de ordenamiento (precio, nombre, marca, sku, fecha)
        in: query
        name: sort_by
        type: string
      - description: Dirección del orden (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginaProductosAdminDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
      summary: Catálogo de productos para administración
      tags:
      - admin
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      description: Valida el token de Google y aplica lógica find-or-create para la
        cuenta de usuario
      parameters:
      - description: Token JWT de Google
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
      summary: Inicio de sesión con Google
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifica credenciales de acceso, valida cuenta activa y emite token
        JWT firmado
      parameters:
      - description: Credenciales de acceso
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
      summary: Inicio de sesión local de usuario
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Endpoint protegido para verificar identidad y claims extraídos
        del token JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
      summary: Perfil del usuario autenticado
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Permite al usuario autenticado actualizar su nombre, correo, teléfono,
        dirección o contraseña. El ID se extrae directamente del token JWT (prevención
        IDOR).
      parameters:
      - description: Campos a actualizar
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.ActualizarPerfilDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PerfilUsuarioDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
      summary: Actualización parcial del perfil de usuario
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Valida complejidad de contraseña, encripta con bcrypt, crea usuario
        y genera automáticamente cookie HttpOnly para inicio de sesión inmediato
      parameters:
      - description: Datos de registro
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.RegistroRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RegistroResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.RespuestaError'
      summary: Registrar nuevo usuario con auto-login
      tags:
      - auth
  /api/v1/productos:
    get:
      description: Obtiene una lista paginada de productos con soporte para múltiples
        filtros (categoría, supermercado, marca, rango de precio, en oferta) y ordenamiento.
      parameters:
      - description: Búsqueda por texto libre
        in: query
        name: q
        type: string
      - description: 'Número de página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Cantidad de productos por página (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Filtrar por categoría
        in: query
        name: categoria
        type: string
      - description: Filtrar por supermercado o cadena
        in: query
        name: supermercado
        type: string
      - description: Filtrar por marca
        in: query
        name: marca
        type: string
      - description: Precio mínimo
        in: query
        name: precio_min
        type: number
      - description: Precio máximo
        in: query
        name: precio_max
        type: number
      - description: Filtrar solo productos en oferta
        in: query
        name: en_oferta
        type: boolean
      - description: Criterio de ordenamiento (precio, nombre, marca)
        in: query
        name: sort_by
        type: string
      - description: Dirección del orden (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginaProductosDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Catálogo y filtrado de productos
      tags:
      - productos
  /api/v1/productos/{id}:
    get:
      description: Obtiene la información completa de un producto por su ID junto
        con el historial de precios capturados
      parameters:
      - description: ID del producto (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProductoDetalleDTO'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Consulta detalle de producto y su historial de precios
      tags:
      - productos
  /api/v1/productos/buscar:
    get:
      description: Busca productos que coincidan parcialmente en título, marca o categoría
        con el parámetro 'q' (mínimo 3 caracteres obligatorios).
      parameters:
      - description: Término de búsqueda (mínimo 3 caracteres)
        in: query
        name: q
        required: true
        type: string
      - description: 'Número de página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Cantidad de productos por página (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginaProductosDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Búsqueda de productos por término
      tags:
      - productos
  /api/v1/scraper/productos:
    post:
      consumes:
      - application/json
      description: Guarda productos crudos y capturas de precio sin requerir una sesión
        de trabajo previa
      parameters:
      - description: Lote de productos extraídos
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IngestaLoteDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.IngestaResultadoDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Almacena un lote de productos de forma directa
      tags:
      - scraper
  /api/v1/scraper/trabajos:
    post:
      consumes:
      - application/json
      description: Registra el inicio de una araña de scraping para auditar su ciclo
        de vida y métricas
      parameters:
      - description: Datos de inicio de la sesión
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IniciarTrabajoDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Inicia una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}:
    get:
      description: Retorna los detalles, duración, conteo y errores de un trabajo
        (ideal para bots de Discord)
      parameters:
      - description: UUID del trabajo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Consulta el estado de una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/ejecutar:
    post:
      consumes:
      - application/json
      description: Envía el trabajo a Redis para que el worker Scrapy ejecute el spider
        solicitado
      parameters:
      - description: UUID del trabajo
        in: path
        name: id
        required: true
        type: string
      - description: Spider y parámetros opcionales
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.ejecutarScraperRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Encola un trabajo para ejecución
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/finalizar:
    put:
      consumes:
      - application/json
      description: Marca el término del trabajo como completado o fallido, registrando
        métricas y errores
      parameters:
      - description: UUID del trabajo de scraping
        in: path
        name: id
        required: true
        type: string
      - description: Datos de cierre de la sesión
        in: body
        name: input
        required: true
        schema:
