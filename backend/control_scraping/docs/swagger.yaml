basePath: /
definitions:
  api.RespuestaError:
    properties:
      detalle:
        type: string
      estado:
        type: integer
      mensaje:
        type: string
    type: object
  api.solicitudEjecucion:
    properties:
      add_url:
        type: string
      enrich_ean:
        type: boolean
      producto_id:
        type: string
      producto_url:
        type: string
      spider:
        type: string
    type: object
  domain.FinalizarTrabajoDTO:
    properties:
      elementos_extraidos:
        type: integer
      estado:
        type: string
      registro_errores:
        type: string
      respuestas_bloqueadas:
        type: integer
    required:
    - estado
    type: object
  domain.IngestaLoteDTO:
    properties:
      codigo_sucursal:
        type: string
      productos:
        items:
          $ref: '#/definitions/domain.ProductoScrapeadoDTO'
        minItems: 1
        type: array
      sucursal_id:
        type: integer
      supermercado:
        type: string
    required:
    - productos
    type: object
  domain.IngestaResultadoDTO:
    properties:
      actualizados:
        type: integer
      errores:
        items:
          type: string
        type: array
      insertados:
        type: integer
      mensaje:
        type: string
      precios_registrados:
        type: integer
      sucursal_id:
        type: integer
      total_recibidos:
        type: integer
      trabajo_id:
        type: string
    type: object
  domain.IniciarTrabajoDTO:
    properties:
      cadena_id:
        type: integer
      disparado_por_usuario_id:
        type: string
      supermercado:
        type: string
    required:
    - cadena_id
    type: object
  domain.ProductoScrapeadoDTO:
    properties:
      categoria:
        type: string
      ean_gtin:
        type: string
      en_stock:
        type: boolean
      formato_crudo:
        type: string
      imagen:
        type: string
      marca:
        type: string
      mecanica_promocion:
        type: string
      metrica_unidad:
        type: string
      precio:
        type: number
      precio_normal:
        type: number
      precio_oferta:
        type: number
      precio_por_unidad:
        type: number
      precio_tarjeta:
        type: number
      producto:
        type: string
      sku:
        type: string
      url_imagen:
        type: string
      url_producto:
        type: string
    required:
    - precio_normal
    - producto
    - sku
    type: object
  domain.TrabajoScraperDTO:
    properties:
      cadena_id:
        type: integer
      cadena_nombre:
        type: string
      duracion_segundos:
        type: number
      elementos_extraidos:
        type: integer
      estado:
        type: string
      finalizado_el:
        type: string
      id:
        type: string
      iniciado_el:
        type: string
      registro_errores:
        type: string
      respuestas_bloqueadas:
        type: integer
    type: object
info:
  contact: {}
  description: Contrato del servicio de coordinación. Identidad y Catálogo se atienden
    por Gateway y no forman parte de esta especificación.
  title: Control de Scraping
  version: "1.0"
paths:
  /:
    get:
      description: Endpoint raíz para comprobar que el servicio responde
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Muestra mensaje de bienvenida
      tags:
      - root
  /api/v1/health:
    get:
      description: 'Readiness: requiere la conexión PostgreSQL de coordinación; Redis
        es diagnóstico y puede degradarse sin retirar la API.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Comprobación de salud del servicio (Healthcheck)
      tags:
      - health
  /api/v1/scraper/productos:
    post:
      consumes:
      - application/json
      description: Igual que la ingesta con trabajo; la cadena se resuelve por supermercado
        o por la sucursal indicada.
      parameters:
      - description: UUID estable del lote
        in: header
        name: Idempotency-Key
        type: string
      - description: Lote de productos extraídos
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IngestaLoteDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.IngestaResultadoDTO'
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.RespuestaError'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenServicio: []
      summary: Registra y entrega un lote sin trabajo a Catálogo
      tags:
      - scraper
  /api/v1/scraper/trabajos:
    post:
      consumes:
      - application/json
      description: Registra el inicio de un trabajo para auditar su ciclo de vida
        y métricas
      parameters:
      - description: Datos de inicio de la sesión
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IniciarTrabajoDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.RespuestaError'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenServicio: []
      summary: Inicia una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}:
    get:
      description: Devuelve detalles, duración, conteo y errores de un trabajo (lo
        usa el bot de Discord)
      parameters:
      - description: UUID del trabajo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.RespuestaError'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenServicio: []
      summary: Consulta el estado de una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/ejecutar:
    post:
      consumes:
      - application/json
      description: Guarda la ejecución en el outbox SQL; Control la publica en Redis
        Streams para que Scraper Go ejecute el spider solicitado.
      parameters:
      - description: UUID del trabajo
        in: path
        name: id
        required: true
        type: string
      - description: Spider y parámetros opcionales
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/api.solicitudEjecucion'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.RespuestaError'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenServicio: []
      summary: Encola un trabajo para ejecución
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/finalizar:
    put:
      consumes:
      - application/json
      description: Marca el trabajo como completado o fallido. Repetir el mismo cierre
        devuelve el trabajo sin cambios.
      parameters:
      - description: UUID del trabajo de scraping
        in: path
        name: id
        required: true
        type: string
      - description: Datos de cierre de la sesión
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.FinalizarTrabajoDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.RespuestaError'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenServicio: []
      summary: Finaliza una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/productos:
    post:
      consumes:
      - application/json
      description: Conserva la entrega durable en Control, usa una clave estable en
        Catálogo y confirma el contador una sola vez. Responde 202 con Retry-After
        si el lote sigue en curso.
      parameters:
      - description: UUID del trabajo de scraping
        in: path
        name: id
        required: true
        type: string
      - description: UUID estable del lote
        in: header
        name: Idempotency-Key
        type: string
      - description: Lote de productos extraídos
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IngestaLoteDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.IngestaResultadoDTO'
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.RespuestaError'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties: true
            type: object
      security:
      - TokenServicio: []
      summary: Registra y entrega un lote con trabajo a Catálogo
      tags:
      - scraper
  /health:
    get:
      description: 'Readiness: requiere la conexión PostgreSQL de coordinación; Redis
        es diagnóstico y puede degradarse sin retirar la API.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Comprobación de salud del servicio (Healthcheck)
      tags:
      - health
securityDefinitions:
  TokenServicio:
    description: Bearer SCRAPING_SERVICE_TOKEN (Scraper Go y bot de Discord).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
