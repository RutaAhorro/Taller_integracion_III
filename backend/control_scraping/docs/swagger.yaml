basePath: /
definitions:
  domain.FinalizarTrabajoDTO:
    properties:
      elementos_extraidos:
        type: integer
      estado:
        description: '''completado'' o ''fallido'''
        type: string
      registro_errores:
        type: string
      respuestas_bloqueadas:
        type: integer
    required:
    - estado
    type: object
  domain.IngestaLoteDTO:
    properties:
      codigo_sucursal:
        type: string
      productos:
        items:
          $ref: '#/definitions/domain.ProductoScrapeadoDTO'
        minItems: 1
        type: array
      sucursal_id:
        type: integer
      supermercado:
        type: string
    required:
    - productos
    type: object
  domain.IngestaResultadoDTO:
    properties:
      actualizados:
        type: integer
      errores:
        items:
          type: string
        type: array
      insertados:
        type: integer
      mensaje:
        type: string
      precios_registrados:
        type: integer
      sucursal_id:
        type: integer
      total_recibidos:
        type: integer
      trabajo_id:
        type: string
    type: object
  domain.IniciarTrabajoDTO:
    properties:
      cadena_id:
        type: integer
      disparado_por_usuario_id:
        type: string
      supermercado:
        type: string
    required:
    - cadena_id
    type: object
  domain.ProductoScrapeadoDTO:
    properties:
      categoria:
        type: string
      ean_gtin:
        type: string
      en_stock:
        type: boolean
      formato_crudo:
        type: string
      imagen:
        type: string
      marca:
        type: string
      mecanica_promocion:
        type: string
      metrica_unidad:
        type: string
      precio:
        type: number
      precio_normal:
        type: number
      precio_oferta:
        type: number
      precio_por_unidad:
        type: number
      precio_tarjeta:
        type: number
      producto:
        type: string
      sku:
        type: string
      url_imagen:
        type: string
      url_producto:
        type: string
    required:
    - precio_normal
    - producto
    - sku
    type: object
  domain.TrabajoScraperDTO:
    properties:
      cadena_id:
        type: integer
      cadena_nombre:
        type: string
      duracion_segundos:
        type: number
      elementos_extraidos:
        type: integer
      estado:
        type: string
      finalizado_el:
        type: string
      id:
        type: string
      iniciado_el:
        type: string
      registro_errores:
        type: string
      respuestas_bloqueadas:
        type: integer
    type: object
  handlers.ejecutarScraperRequest:
    properties:
      add_url:
        type: string
      enrich_ean:
        type: boolean
      producto_id:
        type: string
      producto_url:
        type: string
      spider:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Contrato del servicio de coordinación. Identidad y Catálogo se atienden
    por Gateway y no forman parte de esta especificación.
  title: Control de Scraping
  version: "1.0"
paths:
  /:
    get:
      description: Endpoint raíz para comprobar el estado de la API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Muestra mensaje de bienvenida
      tags:
      - root
  /api/v1/health:
    get:
      description: 'Readiness: requiere la conexión PostgreSQL de coordinación; Redis
        es diagnóstico y puede degradarse sin retirar la API.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Comprobación de salud del servicio (Healthcheck)
      tags:
      - health
  /api/v1/scraper/productos:
    post:
      consumes:
      - application/json
      description: Guarda productos crudos y capturas de precio sin requerir una sesión
        de trabajo previa
      parameters:
      - description: Lote de productos extraídos
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IngestaLoteDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.IngestaResultadoDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Almacena un lote de productos de forma directa
      tags:
      - scraper
  /api/v1/scraper/trabajos:
    post:
      consumes:
      - application/json
      description: Registra el inicio de una araña de scraping para auditar su ciclo
        de vida y métricas
      parameters:
      - description: Datos de inicio de la sesión
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IniciarTrabajoDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Inicia una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}:
    get:
      description: Retorna los detalles, duración, conteo y errores de un trabajo
        (ideal para bots de Discord)
      parameters:
      - description: UUID del trabajo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Consulta el estado de una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/ejecutar:
    post:
      consumes:
      - application/json
      description: Envía el trabajo a Redis para que el worker Scrapy ejecute el spider
        solicitado
      parameters:
      - description: UUID del trabajo
        in: path
        name: id
        required: true
        type: string
      - description: Spider y parámetros opcionales
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.ejecutarScraperRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Encola un trabajo para ejecución
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/finalizar:
    put:
      consumes:
      - application/json
      description: Marca el término del trabajo como completado o fallido, registrando
        métricas y errores
      parameters:
      - description: UUID del trabajo de scraping
        in: path
        name: id
        required: true
        type: string
      - description: Datos de cierre de la sesión
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.FinalizarTrabajoDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.TrabajoScraperDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Finaliza una sesión de scraping
      tags:
      - scraper
  /api/v1/scraper/trabajos/{id}/productos:
    post:
      consumes:
      - application/json
      description: Conserva la entrega durable en Control, usa una clave estable en
        Catálogo y confirma el contador una sola vez.
      parameters:
      - description: UUID del trabajo de scraping
        in: path
        name: id
        required: true
        type: string
      - description: Lote de productos extraídos
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.IngestaLoteDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.IngestaResultadoDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Registra y entrega un lote con trabajo a Catálogo
      tags:
      - scraper
  /health:
    get:
      description: 'Readiness: requiere la conexión PostgreSQL de coordinación; Redis
        es diagnóstico y puede degradarse sin retirar la API.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Comprobación de salud del servicio (Healthcheck)
      tags:
      - health
swagger: "2.0"
