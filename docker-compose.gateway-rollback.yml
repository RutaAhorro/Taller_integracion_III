# Docker Compose >= 2.24.4. Return api:8080 to the existing backend.
services:
  control_scraping:
    healthcheck:
      test: [CMD, wget, '-q', '--spider', 'http://127.0.0.1:8080/health']
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      DB_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    # Desde SUP-268 la API actual no tiene lector: restaurar también su imagen.
    image: ${SUP268_LEGACY_API_IMAGE:?Define una imagen de API anterior a SUP-268}
    build: !reset null
    networks:
      microservices_net:
        aliases: !override [api-backend, api]
  gateway:
    networks:
      microservices_net:
        aliases: !override []
  frontend:
    depends_on: !override
      control_scraping:
        condition: service_healthy
  bot_discord:
    depends_on: !override
      control_scraping:
        condition: service_healthy
  scraper_worker:
    depends_on: !override
      redis:
        condition: service_healthy
      control_scraping:
        condition: service_healthy
